<!doctype html>
<html><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><title>Syft Notes</title>
<style>
body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:CanvasText;background:Canvas}
main{max-width:460px;margin:12vh auto 0;padding:0 24px}
.h{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;margin-bottom:28px}
.h img{width:28px;height:28px;border-radius:7px}
h1{font-size:26px;line-height:1.25;margin:0 0 10px;letter-spacing:-.3px}
p{margin:0 0 18px;color:GrayText}
.row{display:flex;gap:8px;align-items:center}
button{appearance:none;border:0;border-radius:980px;padding:9px 20px;font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer;
  background:rgba(127,127,127,.18);color:CanvasText}
button.p{background:CanvasText;color:Canvas}
.q{font-size:13px}
.tick{font-size:20px}
[hidden]{display:none!important}
</style></head>
<body><main>
<div class="h"><img src="icon-48.png" alt=""><span>Syft Notes</span></div>
<h1 id="t">Connecting to Syft Notes…</h1>
<p id="s">Looking for Syft Notes on this computer.</p>
<div class="row"><button class="p" id="allow" hidden>Allow</button><button id="again" hidden>Try again</button></div>
<p class="q" id="other" hidden>Your school's Canvas isn't at instructure.com? Open it in this browser and sign in, then click the Syft Notes button at the top right (it may be under the puzzle-piece button).</p>
</main>
<script src="connection.js"></script><script src="welcome.js"></script></body></html>
