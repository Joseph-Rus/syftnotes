# Syft Notes for iPhone and iPad. `xcodegen` turns this into StudyStash.xcodeproj (not checked in).
name: StudyStash
options:
  bundleIdPrefix: app.studystash
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.2.4"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: G67978NLXW
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  StudyStash:
    type: application
    platform: iOS
    dependencies:
      - target: StudyStashWidgets
        embed: true
    sources:
      - path: Shared
      - path: StudyStash
        excludes: [Resources/Notes]
      # KaTeX's stylesheet finds its fonts at fonts/…: kept as a folder in the app, not flattened.
      - path: StudyStash/Resources/Notes
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.studystash.ios
        PRODUCT_NAME: StudyStash
        CODE_SIGN_ENTITLEMENTS: StudyStash/StudyStash.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Syft Notes
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: Take photos of the whiteboard to add to your lecture's notes, and scan the QR code Syft Notes shows on your computer to add this phone.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record lectures so Syft Notes can write notes from them.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Write down what's said in a lecture, on this phone.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Reach the Syft Notes library on your computer.
        # Continue with Google (the phone over Google Drive, docs/phone-google.md): the iOS client Google Cloud gave
        # for bundle app.studystash.ios in project study-stash-app, and the same id turned round (Google's redirect
        # scheme for it). Not secret: every copy of the app carries it. Both are placeholders until the client is
        # made; while they are, Continue with Google says it isn't set up in this copy.
        GOOGLE_IOS_CLIENT_ID: 1073354844610-f1atouke3snqb1e2u6eqffnv8hiskj5k.apps.googleusercontent.com
        GOOGLE_IOS_URL_SCHEME: com.googleusercontent.apps.1073354844610-f1atouke3snqb1e2u6eqffnv8hiskj5k
    info:
      path: StudyStash/Info.plist
      properties:
        # The one typeface, Atkinson Hyperlegible Next (the desktop's own files, OFL), in Resources/Fonts.
        UIAppFonts: &fonts
          - AtkinsonHyperlegibleNext-Light.ttf
          - AtkinsonHyperlegibleNext-Regular.ttf
          - AtkinsonHyperlegibleNext-Medium.ttf
          - AtkinsonHyperlegibleNext-SemiBold.ttf
          - AtkinsonHyperlegibleNext-Bold.ttf
          - AtkinsonHyperlegibleNext-ExtraBold.ttf
          # The wordmark's Archivo (OFL): "syft" in Black Italic, " notes" in Regular.
          - Archivo-BlackItalic.ttf
          - Archivo-Regular.ttf
        # The launch screen: the pixel s, still, on the splash's own background (white, or ink in the dark), the same
        # size and place as the animated splash that follows it (Design/Syft.swift).
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: false
        # The library is on the student's own tailnet: plain http at its Tailscale IP when https (Tailscale Serve)
        # isn't set up. Tailscale encrypts that traffic itself.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes: [audio, fetch]
        NSSupportsLiveActivities: true
        # Export compliance: the only encryption is the system's own (https through URLSession), which is exempt, so
        # App Store Connect doesn't ask about it for each build.
        ITSAppUsesNonExemptEncryption: false
        # Opened from another app's share sheet: recordings, PDFs and photos, and GoodNotes notebooks.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Recording
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, public.mpeg-4-audio, com.apple.m4a-audio, public.mp3, com.microsoft.waveform-audio]
          - CFBundleTypeName: Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf, public.image, public.presentation, org.openxmlformats.presentationml.presentation]
          - CFBundleTypeName: GoodNotes notebook
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [app.studystash.goodnotes]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: app.studystash.goodnotes
            UTTypeDescription: GoodNotes notebook
            UTTypeConformsTo: [public.data, public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [goodnotes]
        LSSupportsOpeningDocumentsInPlace: false
        # studystash://lecture/<id>?at=…, record, recording, class/<name>, due, assignment/<class>/<id>, ask, home:
        # where widgets, the Live Activity and notifications open the app (AppLink); google?account=… is a laptop's
        # QR code for the phone over Google Drive, scanned with the Camera app.
        CFBundleURLTypes:
          - CFBundleURLName: app.studystash.ios
            CFBundleURLSchemes: [studystash]
          # Google sends the sign-in back here (com.googleusercontent.apps.<id>:/oauth2redirect).
          - CFBundleURLName: app.studystash.ios.google
            CFBundleURLSchemes: [$(GOOGLE_IOS_URL_SCHEME)]
        GoogleClientID: $(GOOGLE_IOS_CLIENT_ID)
        BGTaskSchedulerPermittedIdentifiers: [app.studystash.ios.refresh]
  StudyStashWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: StudyStashWidgets
      - path: Shared
      # The look, the same as the app's: its tokens, type and icons, the fonts and the icons' image sets.
      - path: StudyStash/Design/Theme.swift
      - path: StudyStash/Design/Type.swift
      - path: StudyStash/Design/Icons.swift
      # The app's words for dates, times and lengths ("Tomorrow 9:00 AM", "Sun 18 Oct, in 6 days").
      - path: StudyStash/App/Format.swift
      - path: StudyStash/Resources/Icons.xcassets
      - path: StudyStash/Resources/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.studystash.ios.widgets
        PRODUCT_NAME: StudyStashWidgets
        CODE_SIGN_ENTITLEMENTS: StudyStashWidgets/StudyStashWidgets.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Syft Notes
    info:
      path: StudyStashWidgets/Info.plist
      properties:
        UIAppFonts: *fonts
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  StudyStashTests:
    type: bundle.unit-test
    platform: iOS
    sources: [StudyStashTests]
    dependencies:
      - target: StudyStash
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.studystash.ios.tests
  # The journeys a student takes (FLOWS.md), walked with real taps on the demo library.
  StudyStashUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [StudyStashUITests]
    dependencies:
      - target: StudyStash
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.studystash.ios.uitests
        TEST_TARGET_NAME: StudyStash
schemes:
  StudyStash:
    build:
      targets:
        StudyStash: all
        StudyStashTests: [test]
        StudyStashUITests: [test]
    test:
      targets: [StudyStashTests, StudyStashUITests]
