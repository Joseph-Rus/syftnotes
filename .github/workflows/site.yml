# The website (site/): every page, link and download checked (site/check.mjs) when a change to it reaches main or a pull
# request. Publishing is by hand (firebase deploy, see site/README.md): the repository has no Firebase key, and the
# deploy job that waited for one never ran, so it is gone.
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "firebase.json", ".firebaserc", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "firebase.json", ".firebaserc", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check every page, link and download
        run: node site/check.mjs
