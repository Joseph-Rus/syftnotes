# The build and release pipeline for Study Stash (C# on .NET 10, one app for both roles). Two speeds, one workflow.
#
#   A merge (a push to main) proves the code, and nothing it would throw away:
#     - the engine's two test projects (Core and App) on macOS, Linux and Windows, each in a job of its own, so all six
#       run side by side (the old single job ran the two one after the other);
#     - the Mac app and the Windows app built and self-tested for real (windows open, the pretend microphone records,
#       Whisper hears it), once as a laptop and once as "just this computer"; the Mac's two run on two computers.
#     No installers are made for it: no Setup.exe (the build leaves it out), no DMG kept (macos/build-app.sh makes
#     it as its last step either way), no Intel Mac, no install, update or uninstall, and nothing is published.
#
#   A release is a push to main with a StudyStashVersion in engine/Directory.Build.props that has no tag yet. On top of
#   all of the above it builds the installers, proves them where they will really run (the Mac app natively on an
#   Intel Mac; Setup.exe installed, self-tested from the installed copy, updated in place with a silent Setup.exe and
#   uninstalled cleanly), and then publishes release v<version> with the four installers and SHA256SUMS.txt. Installed
#   copies pick it up within a few hours (auto_update), or right away with Update now. A version already released is
#   never published again. Nothing is published unless every test and proof above passed.
#
#   Code that already passed isn't tested twice. A push to main skips the engine tests and the self-tests when it
#     - changes only the version and files that can't change what the code does (the docs, the website, the
#       README), on top of a commit whose run passed; or
#     - merges a branch whose run by hand passed on exactly the same code (main hadn't moved meanwhile).
#   A release that skips the tests still builds and proves its installers, unless that run by hand was a rehearsal of
#   the release too (below) and still holds its installers: then those very installers, built and proved on exactly
#   this code, are the ones published, with no rebuilding, and a merged version bump publishes within a minute.
#   Changes to this workflow are never skipped.
#
#   Branches and pull requests aren't tested on their own. A run by hand (Actions → ci → Run workflow, or
#   `gh workflow run ci --ref <branch>`) is how one is proved before it merges, and it tests as a merge does.
#   On code whose version has no tag yet (a release branch), or with "installers" ticked
#   (`gh workflow run ci --ref <branch> -f installers=true`), it rehearses the whole release too, down to the checksums,
#   and publishes nothing, ever. Give it "reuse_run" (an earlier such run's id, on the same code) to rehearse the fast
#   release above.
#
#   Measured when this shape was made, start to finish: a merge 9 to 11 minutes, a full rehearsal of a release 10
#   (the old workflow took 12 to 16 for every merge and every release alike), and a release that publishes the
#   installers a rehearsal already proved under a minute.
#
#   Runs are never cancelled by a later push: each push to main has a group of its own, so a release run isn't
#   cancelled by the push after it, nor skipped while waiting for the one before. (Runs by hand on one branch
#   replace each other.) The plan (what is tested, what is built, what is reused) is decided in the first job, by
#   .github/scripts/plan.sh, and printed on the run's summary.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      installers:
        description: "Build and prove the installers too, as a release does (always on for code whose version has no tag yet). Nothing is published from a run by hand."
        type: boolean
        default: false
      reuse_run:
        description: "Rehearse a release's fast path: the id of an earlier run by hand on exactly this code, whose installers are reused, not rebuilt."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # What this run has to do: the version, whether it is a release, whether this code already passed, and whether a
  # run by hand already built and proved the installers.
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read  # to see whether the commit before this one, or the pull request merged here, passed ci
      pull-requests: read  # to find the pull request a push to main merged
    outputs:
      version: ${{ steps.plan.outputs.version }}
      new: ${{ steps.plan.outputs.new }}
      installers: ${{ steps.plan.outputs.installers }}
      tested: ${{ steps.plan.outputs.tested }}
      reuse_run: ${{ steps.plan.outputs.reuse_run }}
    steps:
      - uses: actions/checkout@v4
      # A run by hand keeps the exact tree it tests, so that merging that branch into main with the very same code
      # (main hadn't moved meanwhile) is known to have passed already (plan.sh).
      - if: github.event_name != 'push'
        run: git rev-parse 'HEAD^{tree}' > tested-tree.txt
      - if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: tested-tree
          path: tested-tree.txt
          retention-days: 30
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          REPO: ${{ github.repository }}
          WANT_INSTALLERS: ${{ inputs.installers }}
          REUSE_RUN: ${{ inputs.reuse_run }}
        run: bash .github/scripts/plan.sh

  # The C# engine (engine/): every test on each system. Golden/ holds fixed expectations the tests compare byte for
  # byte. The two test projects are two jobs per system: they used to run one after the other in one job, and the
  # Windows one needed 12 to 14 minutes for it. Each has a machine of its own, so one is no busier than before.
  engine:
    name: Engine ${{ matrix.suite }} tests (${{ matrix.os }})
    needs: [version]
    if: needs.version.outputs.tested != 'true'
    strategy:
      fail-fast: false  # a flake in one doesn't hide the rest, and re-running a failed job re-runs only it
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        suite: [Core, App]
    # A leg takes 2 to 9 minutes; the App tests on a slow Windows runner the most. 15 and 20 only bound a hang.
    timeout-minutes: ${{ matrix.suite == 'Core' && 15 || 20 }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: ./.github/actions/whisper-tiny
      - name: Where a crashed test process leaves its report
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/crash"
      - name: Run the ${{ matrix.suite }} tests
        run: dotnet test engine/tests/StudyStash.${{ matrix.suite }}.Tests
        env:
          # Windows: also run the library as a real background service, from the Startup folder with no window.
          STUDYSTASH_LIVE_SERVICE: ${{ runner.os == 'Windows' && matrix.suite == 'Core' && '1' || '' }}
          # Windows: the pictures the tests draw are kept, so the notes' formulas and diagrams can be seen as Windows
          # draws them (its own fonts), in the Windows look, light and dark, at 100% and 150%.
          STUDYSTASH_SHOTS: ${{ runner.os == 'Windows' && matrix.suite == 'App' && format('{0}\shots', runner.temp) || '' }}
          # A test process that dies in native code leaves a crash report (every thread's stack, native and .NET)
          # instead of only "exit code 139", so a crash that happens once in a while can be traced the first time.
          DOTNET_DbgEnableMiniDump: ${{ runner.os != 'Windows' && '1' || '' }}
          DOTNET_DbgMiniDumpType: ${{ runner.os != 'Windows' && '1' || '' }}
          DOTNET_EnableCrashReport: ${{ runner.os != 'Windows' && '1' || '' }}
          DOTNET_DbgMiniDumpName: ${{ runner.os != 'Windows' && format('{0}/crash/core.%p', runner.temp) || '' }}
      - name: Crash reports, if a test process crashed
        if: ${{ failure() && runner.os != 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: crash-${{ matrix.os }}-${{ matrix.suite }}
          path: ${{ runner.temp }}/crash/*.crashreport.json
          if-no-files-found: ignore
      - name: The notes' formulas and diagrams, as Windows draws them
        if: ${{ always() && runner.os == 'Windows' && matrix.suite == 'App' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-rich-notes
          path: |
            ${{ runner.temp }}\shots\richwin-*
            ${{ runner.temp }}\shots\rich-*-win-*
          if-no-files-found: error
      - name: Notifications, as Windows draws them, where they land above the taskbar
        if: ${{ always() && runner.os == 'Windows' && matrix.suite == 'App' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-notifications
          path: |
            ${{ runner.temp }}\shots\win-12-notify-*
            ${{ runner.temp }}\shots\win-12-toast-*
          if-no-files-found: error

  # The Mac app: one universal bundle for Apple silicon and Intel, started by its own launcher (D1); ad hoc signed with
  # the microphone entitlement; the DMG (D2). Proved with the real self-test (D5): real windows open, the pretend
  # microphone records, Whisper (Metal) hears the speech from inside the bundle. Only a release uploads the DMG.
  mac-app:
    name: Mac app (self-test, DMG)
    needs: [version]
    if: needs.version.outputs.tested != 'true' || (needs.version.outputs.installers == 'true' && needs.version.outputs.reuse_run == '')
    timeout-minutes: 25
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: ./.github/actions/whisper-tiny
        if: needs.version.outputs.tested != 'true'
      - name: install.sh parses
        run: sh -n install.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build Study Stash.app and its one DMG
        run: sh macos/build-app.sh dist/mac
      - name: The app carries the phone app, which the library serves at /app/
        run: |
          for arch in arm64 x64; do
            for f in index.html sw.js manifest.webmanifest; do
              test -f "dist/mac/Study Stash.app/Contents/MacOS/$arch/web/$f" || { echo "no web/$f in the $arch tree"; exit 1; }
            done
          done
      - name: Signed, universal, and reports its version on both architectures
        run: |
          APP="dist/mac/Study Stash.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -info "$APP/Contents/MacOS/StudyStash" | grep -q "x86_64"
          lipo -info "$APP/Contents/MacOS/StudyStash" | grep -q "arm64"
          V=$(env -u DOTNET_ROOT "$APP/Contents/MacOS/StudyStash" version)
          [ -n "$V" ]
          softwareupdate --install-rosetta --agree-to-license 2>/dev/null || true
          [ "$(env -u DOTNET_ROOT arch -x86_64 "$APP/Contents/MacOS/StudyStash" version)" = "$V" ]
      - name: Self-test (D5) - real windows, the pretend mic, Whisper from inside the bundle
        if: needs.version.outputs.tested != 'true'
        run: sh macos/selftest.sh "dist/mac/Study Stash.app" "$RUNNER_TEMP/selftest"
      - name: The DMG holds the app with no role of its own (setup asks), and no model is bundled (D6)
        run: |
          mnt="$RUNNER_TEMP/mnt-dmg"
          mkdir -p "$mnt"
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$mnt" dist/mac/Study-Stash.dmg
          if /usr/libexec/PlistBuddy -c "Print :StudyStashRole" "$mnt/Study Stash.app/Contents/Info.plist" >/dev/null 2>&1; then
            hdiutil detach -quiet "$mnt"
            echo "Study-Stash.dmg's app still says a role" >&2
            exit 1
          fi
          [ -L "$mnt/Applications" ]
          if find "$mnt" -iname 'ggml-*.bin' -o -name '*.bin' -size +1M | grep -q .; then
            hdiutil detach -quiet "$mnt"
            echo "a model file is bundled in Study-Stash.dmg" >&2
            exit 1
          fi
          hdiutil detach -quiet "$mnt"
      - uses: actions/upload-artifact@v4
        if: needs.version.outputs.installers == 'true'
        with:
          name: mac-installers
          path: dist/mac/Study-Stash.dmg
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always() && needs.version.outputs.tested != 'true'
        with:
          name: mac-selftest
          path: ${{ runner.temp }}/selftest

  # The Mac app's second self-test, on a computer of its own so it runs beside the first: Just this computer, where
  # setup makes the app's own library and the notes are written here.
  mac-one-computer:
    name: Mac app self-test (just this computer)
    needs: [version]
    if: needs.version.outputs.tested != 'true'
    timeout-minutes: 25
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: ./.github/actions/whisper-tiny
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build Study Stash.app
        run: sh macos/build-app.sh dist/mac
      - name: Self-test, just this computer - setup makes the app's own library, and the notes are written here
        env:
          STUDYSTASH_SELFTEST_FLOW: one-computer
        run: sh macos/selftest.sh "dist/mac/Study Stash.app" "$RUNNER_TEMP/selftest/one-computer"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-one-computer-selftest
          path: ${{ runner.temp }}/selftest

  # The Intel self-test (D5), for real: a physical Intel Mac, so the x64 tree runs natively (mac-app already checked
  # it runs enough to print its version under Rosetta). A release only.
  mac-intel:
    name: Mac app self-test (Intel)
    needs: [version, mac-app]
    if: needs.version.outputs.installers == 'true' && needs.version.outputs.reuse_run == ''
    timeout-minutes: 20
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mac-installers
          path: dist/mac
      - uses: ./.github/actions/whisper-tiny
      - name: Mount the DMG and copy the app out (artifacts lose exec bits, so it travels as a DMG)
        run: |
          mkdir -p "$RUNNER_TEMP/mnt"
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$RUNNER_TEMP/mnt" dist/mac/Study-Stash.dmg
          ditto "$RUNNER_TEMP/mnt/Study Stash.app" "$RUNNER_TEMP/Study Stash.app"
          hdiutil detach -quiet "$RUNNER_TEMP/mnt"
          codesign --verify --deep --strict "$RUNNER_TEMP/Study Stash.app"
      - name: Self-test, natively on Intel
        run: sh macos/selftest.sh "$RUNNER_TEMP/Study Stash.app" "$RUNNER_TEMP/selftest"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-intel-selftest
          path: ${{ runner.temp }}/selftest

  # The Windows app: one Setup.exe with no role of its own (setup asks). Both trees are built and checked, then
  # self-tested (D5) as just this computer and as a laptop. A merge stops there (the build leaves Setup.exe out). A
  # release also builds Setup.exe, installs it, self-tests as a laptop from the installed copy (so what Setup.exe put
  # there, native code and all, is what runs), updates it in place with a silent Setup.exe, and uninstalls it without
  # touching lectures or settings outside the install folder.
  windows-app:
    name: Windows app (self-test, Setup.exe)
    needs: [version]
    if: needs.version.outputs.tested != 'true' || (needs.version.outputs.installers == 'true' && needs.version.outputs.reuse_run == '')
    timeout-minutes: 25
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Inno Setup 6, if this image lacks it
        if: needs.version.outputs.installers == 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: A merge ships nothing, so Inno Setup is put aside and the build leaves Setup.exe out
        if: needs.version.outputs.installers != 'true'
        shell: pwsh
        run: |
          # windows\build.ps1 builds Setup.exe only where it finds Inno Setup 6, and says so when it doesn't.
          $iscc = @((Get-Command iscc -ErrorAction SilentlyContinue).Source,
                    "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          foreach ($exe in $iscc) {
            if ($exe -and (Test-Path $exe)) { Write-Host "putting $exe aside"; Rename-Item $exe "$(Split-Path -Leaf $exe).aside" }
          }
      - uses: ./.github/actions/whisper-tiny
      - name: install.ps1 parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw "install.ps1 doesn't parse: $errors" }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build win-x64 and win-arm64, and Study-Stash-Setup.exe
        shell: pwsh
        run: .\windows\build.ps1 -Out dist\windows
      - name: Both trees carry the phone app, which the library serves at /app/
        shell: pwsh
        run: |
          foreach ($rid in "win-x64", "win-arm64") {
            foreach ($f in "index.html", "sw.js", "manifest.webmanifest") {
              if (-not (Test-Path "dist\windows\$rid\web\$f")) { throw "no web\$f in the $rid tree" }
            }
          }
      - name: Reports the version from Directory.Build.props, and no model is bundled (D6)
        shell: pwsh
        run: |
          $V = (Select-String -Path engine\Directory.Build.props -Pattern '<StudyStashVersion>(.*)</StudyStashVersion>').Matches[0].Groups[1].Value
          if (-not $V) { throw "no StudyStashVersion in engine/Directory.Build.props" }
          $printed = (& "dist\windows\win-x64\StudyStash.exe" version | Out-String).Trim()
          if ($printed -ne $V) { throw "version printed '$printed', expected '$V'" }
          echo "V=$V" >> $env:GITHUB_ENV
          $bad = Get-ChildItem dist\windows -Recurse -File -Filter "*.bin" -ErrorAction SilentlyContinue | Where-Object { $_.Length -gt 1MB }
          if ($bad) { throw "a model file is bundled: $($bad.FullName -join ', ')" }
      - name: Both trees carry the notes' formula and diagram code, its native parts built for their own processor, and no debug symbols
        shell: pwsh
        run: |
          foreach ($tree in @(@("win-x64", 0x8664), @("win-arm64", 0xAA64))) {
            $rid = $tree[0]; $machine = $tree[1]
            foreach ($f in "CSharpMath.SkiaSharp.dll", "CSharpMath.Rendering.dll", "Svg.Skia.dll", "Microsoft.Msagl.dll", "Markdig.dll", "SkiaSharp.dll", "HarfBuzzSharp.dll") {
              if (-not (Test-Path "dist\windows\$rid\$f")) { throw "$rid has no $f" }
            }
            foreach ($f in "libSkiaSharp.dll", "libHarfBuzzSharp.dll") {
              $bytes = [IO.File]::ReadAllBytes("dist\windows\$rid\$f")
              $built = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3C) + 4)
              if ($built -ne $machine) { throw "$rid\$f is built for machine 0x$('{0:X}' -f $built), not 0x$('{0:X}' -f $machine)" }
            }
            $symbols = @(Get-ChildItem "dist\windows\$rid" -Recurse -File -Filter "*.pdb")
            if ($symbols.Count -gt 0) { throw "$rid carries debug symbols: $($symbols.Name -join ', ')" }
          }
      - name: Self-test, just this computer - setup makes the app's own library, the notes are written here, and quitting stops it
        if: needs.version.outputs.tested != 'true'
        shell: pwsh
        timeout-minutes: 12
        run: |
          $selftestHome = "$env:RUNNER_TEMP\selftest-home-one-computer"
          $out = "$env:RUNNER_TEMP\selftest\one-computer"
          New-Item -ItemType Directory -Force -Path $selftestHome, $out | Out-Null
          $env:STUDYSTASH_SELFTEST = $out
          $env:STUDYSTASH_SELFTEST_FLOW = "one-computer"
          $env:STUDYSTASH_MIC_FILE = (Resolve-Path "engine\tests\StudyStash.Core.Tests\Fixtures\speech.wav").Path
          $env:STUDYSTASH_MIC_SPEED = "4"
          $env:STUDYSTASH_MODEL_FILE = $env:STUDYSTASH_WHISPER_MODEL
          $exe = (Resolve-Path "dist\windows\win-x64\StudyStash.exe").Path
          $p = Start-Process -FilePath $exe -ArgumentList "--home", $selftestHome -PassThru
          if (-not $p.WaitForExit(480000)) { $p.Kill(); throw "Study Stash didn't exit within 480 s" }
          $lines = Get-Content "$out\selftest.txt"
          $lines | Write-Host
          if (Test-Path "$selftestHome\logs\library.log") { Write-Host "--- library.log"; Get-Content "$selftestHome\logs\library.log" -Tail 40 | Write-Host }
          if ($p.ExitCode -ne 0) { throw "exit code $($p.ExitCode)" }
          if ($lines[-1] -ne "ok") { throw "last line was not ok" }
          if ($lines -match "heard nothing|no model|recording didn't start|FAILED") { throw "the self-test reported a problem" }
          if (-not ($lines -match "just this computer")) { throw "the self-test didn't run Just this computer" }
          if (-not ($lines -match "notes written on this computer by its own library")) { throw "the notes weren't written by this computer's own library" }
          # The library ran as the app's own child (StudyStash.exe serve): quitting the app stops it too.
          $left = $null
          for ($i = 0; $i -lt 20; $i++) {
            $left = @(Get-Process -Name StudyStash -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe })
            if ($left.Count -eq 0) { break }
            Start-Sleep 1
          }
          if ($left.Count -ne 0) { $left | Stop-Process -Force; throw "the app's library (StudyStash.exe serve) was still running 20 s after the app quit" }
      - name: The installer puts Study Stash on this account, with no role of its own (setup asks)
        if: needs.version.outputs.installers == 'true'
        shell: pwsh
        run: |
          Start-Process "dist\windows\Study-Stash-Setup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          $app = "$env:LOCALAPPDATA\Programs\Study Stash"
          if (-not (Test-Path "$app\StudyStash.exe")) { throw "Study Stash isn't installed" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Study Stash.lnk")) { throw "no Start Menu entry" }
          if (Select-String -Path "$app\study-stash.ini" -Pattern "^\s*role\s*=" -Quiet) { throw "the one download wrote a role" }
          $printed = (& "$app\StudyStash.exe" version | Out-String).Trim()
          if ($printed -ne $env:V) { throw "installed version '$printed', expected '$env:V'" }
      # A release runs this from the copy the installer put there; a merge, which has no installer, from the build.
      - name: Self-test (D5), as a laptop - its native code came with the installer, and a lecture's formulas and flowchart draw
        if: needs.version.outputs.tested != 'true' || needs.version.outputs.installers == 'true'
        shell: pwsh
        run: |
          $selftestHome = "$env:RUNNER_TEMP\selftest-home"
          $out = "$env:RUNNER_TEMP\selftest"
          New-Item -ItemType Directory -Force -Path $selftestHome, $out | Out-Null
          $env:STUDYSTASH_SELFTEST = $out
          $env:STUDYSTASH_MIC_FILE = (Resolve-Path "engine\tests\StudyStash.Core.Tests\Fixtures\speech.wav").Path
          $env:STUDYSTASH_MIC_SPEED = "4"
          $env:STUDYSTASH_MODEL_FILE = $env:STUDYSTASH_WHISPER_MODEL
          $exe = if ("${{ needs.version.outputs.installers }}" -eq "true") { "$env:LOCALAPPDATA\Programs\Study Stash\StudyStash.exe" } else { (Resolve-Path "dist\windows\win-x64\StudyStash.exe").Path }
          Write-Host "Self-testing $exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--home", $selftestHome -PassThru
          if (-not $p.WaitForExit(480000)) { $p.Kill(); throw "Study Stash didn't exit within 480 s" }
          $lines = Get-Content "$out\selftest.txt"
          $lines | Write-Host
          if ($p.ExitCode -ne 0) { throw "exit code $($p.ExitCode)" }
          if ($lines[-1] -ne "ok") { throw "last line was not ok" }
          if ($lines -match "heard nothing|no model|recording didn't start|FAILED") { throw "the self-test reported a problem" }
          if (-not ($lines -match "^rich notes: .* typeset; a flowchart laid out")) { throw "the self-test didn't see the notes' formulas and flowchart drawn" }
          if (-not ($lines -match "^opened larger: ")) { throw "the self-test didn't open the flowchart larger" }
      - name: Installing again over an older role install (as an old copy's self-update does) is an in-place upgrade that keeps its role
        if: needs.version.outputs.installers == 'true'
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\Study Stash"
          # What an old Study-Stash-Library-Setup.exe left behind.
          "[app]`r`nrole=library`r`nversion=0.8.0`r`n" | Set-Content -NoNewline "$app\study-stash.ini"
          Start-Process "dist\windows\Study-Stash-Setup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          if (-not (Select-String -Path "$app\study-stash.ini" -Pattern "role\s*=\s*library" -Quiet)) { throw "the old install's role was lost" }
          if (-not (Select-String -Path "$app\study-stash.ini" -Pattern "version\s*=\s*$env:V" -Quiet)) { throw "study-stash.ini doesn't say $env:V" }
          $entries = @(Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq "Study Stash" })
          if ($entries.Count -ne 1) { throw "expected one uninstall entry for Study Stash, found $($entries.Count)" }
      - name: A silent update (relaunch=1) starts the app again from the same folder
        if: needs.version.outputs.installers == 'true'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $app = "$env:LOCALAPPDATA\Programs\Study Stash"
          $updateHome = "$env:RUNNER_TEMP\update-home"
          New-Item -ItemType Directory -Force -Path $updateHome | Out-Null
          Start-Process -FilePath "$app\StudyStash.exe" -ArgumentList "--home", $updateHome, "--background" | Out-Null
          Start-Sleep 3
          # Wait for the installer only: -Wait would also wait for the app it relaunches, which keeps running.
          $setup = Start-Process "dist\windows\Study-Stash-Setup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CLOSEAPPLICATIONS", "/relaunch=1" -PassThru
          $setup.WaitForExit()
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            if (Get-Process -Name StudyStash -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq "$app\StudyStash.exe" }) { $ok = $true; break }
            Start-Sleep 1
          }
          if (-not $ok) { throw "no StudyStash.exe from $app running again within 30 s of the silent update" }
          Get-Process -Name StudyStash -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Uninstalling removes only the app; lectures and settings stay
        if: needs.version.outputs.installers == 'true'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $app = "$env:LOCALAPPDATA\Programs\Study Stash"
          $settingsKeep = "$env:USERPROFILE\.study-stash\keep.txt"
          $lectureKeep = "$env:USERPROFILE\Documents\Study Stash\CS 101\keep.txt"
          New-Item -ItemType Directory -Force -Path (Split-Path $settingsKeep), (Split-Path $lectureKeep) | Out-Null
          "keep" | Out-File $settingsKeep
          "keep" | Out-File $lectureKeep
          Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
          $gone = $false
          for ($i = 0; $i -lt 60; $i++) { if (-not (Test-Path $app)) { $gone = $true; break }; Start-Sleep 1 }
          if (-not $gone) { throw "$app is still there 60 s after uninstalling" }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Study Stash.lnk") { throw "the Start Menu entry survived" }
          if (-not (Test-Path $settingsKeep)) { throw "settings outside the app folder were deleted" }
          if (-not (Test-Path $lectureKeep)) { throw "a lecture outside the app folder was deleted" }
      - uses: actions/upload-artifact@v4
        if: needs.version.outputs.installers == 'true'
        with:
          name: windows-installers
          path: dist\windows\Study-Stash-Setup.exe
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-selftest
          path: ${{ runner.temp }}\selftest

  # Publish v<version> the first time it passes everything above, with the one download per system, the four old role
  # names as byte-for-byte copies of them (0.8.x and older copies update themselves by those names, and old libraries'
  # "Connect your laptop" links point at them), and their checksums. A version already tagged is never published
  # again. The installers are the ones this run built and proved, or the ones a run by hand built and proved on
  # exactly this code. A run by hand goes through all of it but the last step, and publishes nothing.
  release:
    name: publish release
    needs: [version, engine, mac-app, mac-one-computer, mac-intel, windows-app]
    if: ${{ !cancelled() && !failure() && needs.version.outputs.installers == 'true' && (needs.version.outputs.reuse_run != '' || (needs.mac-app.result == 'success' && needs.mac-intel.result == 'success' && needs.windows-app.result == 'success')) }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read  # to download the installers a run by hand built
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mac-installers
          path: dist
          run-id: ${{ needs.version.outputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: dist
          run-id: ${{ needs.version.outputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: ${{ github.event_name == 'push' && 'Publish' || 'Rehearse publishing (a run by hand publishes nothing)' }} v${{ needs.version.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
          PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          test -s dist/Study-Stash.dmg && test -s dist/Study-Stash-Setup.exe || { echo "an installer is missing or empty"; ls -l dist; exit 1; }
          # Re-check the race: another push could have published this tag while this run was building.
          released=false
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null || gh release view "v$V" >/dev/null 2>&1; then released=true; fi
          if [ "$released" = true ] && [ "$PUBLISH" = true ]; then
            echo "v$V is already released; bump StudyStashVersion in engine/Directory.Build.props to publish a new one."
            exit 0
          fi
          for role in Laptop Library; do
            cp dist/Study-Stash.dmg "dist/Study-Stash-$role.dmg"
            cp dist/Study-Stash-Setup.exe "dist/Study-Stash-$role-Setup.exe"
          done
          (cd dist && sha256sum Study-Stash* > SHA256SUMS.txt)
          ls -l dist
          cat dist/SHA256SUMS.txt
          if [ "$PUBLISH" != true ]; then
            echo "A rehearsal: v$V would be published now with the files above. Nothing was."
            if [ "$released" = true ]; then echo "(v$V is already released, so a push would stop before this.)"; fi
            exit 0
          fi
          gh release create "v$V" --target "$GITHUB_SHA" --title "Study Stash $V" --generate-notes \
            dist/Study-Stash.dmg dist/Study-Stash-Setup.exe \
            dist/Study-Stash-Laptop.dmg dist/Study-Stash-Library.dmg \
            dist/Study-Stash-Laptop-Setup.exe dist/Study-Stash-Library-Setup.exe \
            dist/SHA256SUMS.txt
