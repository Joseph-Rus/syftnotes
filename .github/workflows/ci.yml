# The build and release pipeline for Syft Notes (C# on .NET 10, one app for both roles, on a Mac, Windows and Linux).
# Three levels, one workflow:
#
#   1. A pull request into main: the connection rules, and the engine's Core and App tests on Linux (which build every
#      project). No Mac, no Windows, no self-tests, no installers, no real sign-ins, no secrets. It never counts as proof
#      for a merge or a release (plan.sh).
#
#   2. A push to main (a merge) runs everything, on every system, nothing it would throw away:
#     - the engine's Core and App tests: in one job on macOS and one on Linux, and in a job each on Windows, whose App
#       tests are the slowest; then, after the App tests, the real AI sign-ins (reported, but not counted against the
#       run). The failed tests and the 20 slowest are on the run's page;
#     - the Mac app, the Windows app and the Linux app (x64 and arm64, each on its own processor) built and self-tested
#       for real (windows open, the pretend microphone records, Whisper hears it), once as a laptop and once as "just
#       this computer", both on the one app each job built.
#     No installers are made for it, and nothing is published. It blocks nothing (the code is merged): a failure here
#     is fixed straight away.
#     A push to main with a StudyStashVersion in engine/Directory.Build.props that has no tag yet is a release. On top
#     of all of the above it builds the installers, proves them where they will really run (the Mac app natively on an
#     Intel Mac; Setup.exe installed, self-tested from the installed copy, updated in place with a silent Setup.exe and
#     uninstalled cleanly; each Linux tarball installed with its install.sh, self-tested from there and uninstalled),
#     and then publishes release v<version> with the installers and SHA256SUMS.txt. Installed copies pick it up within a
#     few hours (auto_update), or right away with Update now. A version already released is never published again.
#     Nothing is published unless every job it waits for passed or was skipped (a job that ran out of time ends
#     "cancelled", and stops it too).
#
#   3. A run by hand (Actions → ci → Run workflow, or `gh workflow run ci --ref <branch>`) tests a branch as a merge
#      does. On code whose version has no tag yet (a release branch), or with "installers" ticked, it rehearses the
#      whole release too, down to the checksums, and publishes nothing, ever. Give it "reuse_run" (an earlier such
#      run's id, on the same code) to rehearse the fast release below.
#
#   Code that already passed isn't tested twice. A push to main skips the engine tests and the self-tests when it
#     - changes only the version and files that can't change what the code does (the docs, the website, the
#       README, the iPhone app), on top of a commit whose run passed; or
#     - merges a branch whose run by hand passed on exactly the same code (main hadn't moved meanwhile).
#   Only ci's own runs in this repository, started by a push or by hand, are believed (plan.sh). A release that skips
#   the tests still builds and proves its installers, unless that run by hand was a rehearsal and still holds its
#   installers: then those very installers are the ones published, and a merged version bump publishes within a
#   minute. Changes to this workflow are never skipped.
#
#   Signing is switched on by secrets and costs nothing without them. Only a run that builds installers (a release, or
#   a rehearsal of one) can sign, and then only if the repository has the secrets in docs/signing.md: the Mac app is
#   signed with an Apple Developer ID, notarized and stapled, and Windows' exe, dlls, Setup.exe and uninstaller are
#   signed (Azure Artifact Signing). With none of them, the installers are the ad hoc signed Mac app and the unsigned
#   Setup.exe, exactly as before. Some of a group's secrets but not all of them stops the run at the start. Signing is a
#   step of its own, after the build (macos/sign-release.sh, windows/sign-release.ps1), so nothing the build runs ever
#   sees a key, and the Mac's keychain and notary key are removed as soon as the signature is checked. A rehearsal by
#   hand with "test_signing" ticked signs with throwaway self-signed identities that it makes
#   on the runners: that proves every signing step but Apple's and Microsoft's, and its installers are never published
#   (nor reusable by a release). The plan is .github/scripts/signing-plan.sh. The one other secret,
#   GOOGLE_DESKTOP_CLIENT_SECRET, reaches only the builds of the copies that ship (never npm, or the copy with the test
#   helpers).
#
#   Runs are never cancelled by a later push: each push to main has a group of its own, so a release run isn't
#   cancelled by the push after it, nor skipped while waiting for the one before. (Runs by hand on one branch, and runs
#   of one pull request, replace each other.) The plan (what is tested, what is built, what is reused) is decided in
#   the first job, by .github/scripts/plan.sh, and printed on the run's summary.
name: ci

on:
  push:
    branches: [main]
  # Level 1 above: Linux tests only, no secrets. Never pull_request_target, which would run a fork's code with this
  # repository's token and secrets. A pull request that changes only words (docs, the website, the iPhone app, any .md
  # but the tests' Golden expectations) isn't run.
  pull_request:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!site/**"
      - "!ios/**"
      - "!.github/ISSUE_TEMPLATE/**"
      - "!**/*.md"
      - "engine/tests/**/Golden/**"
  workflow_dispatch:
    inputs:
      installers:
        description: "Build and prove the installers too, as a release does (always on for code whose version has no tag yet). Nothing is published from a run by hand."
        type: boolean
        default: false
      test_signing:
        description: "Rehearse the signing steps with throwaway self-signed identities (the Mac app and Setup.exe made as for a release, signed by certificates made on the runners): proves the steps, not Apple's notarization or Microsoft's signing. Those installers can never be published."
        type: boolean
        default: false
      reuse_run:
        description: "Rehearse a release's fast path: the id of an earlier run by hand on exactly this code, whose installers are reused, not rebuilt."
        type: string
        default: ""
      real_sign_in_only:
        description: "Only the real AI sign-ins (Claude Code, Codex, Antigravity in the hidden terminal), and keep what each showed with every address taken out, for a day. Nothing else runs, so the run proves nothing else, and a merge never counts it as tested."
        type: boolean
        default: false

permissions:
  contents: read

# A push to main has a group of its own (its commit), so a release is never cancelled by the push after it. A pull
# request's group is its own (refs/pull/<n>/merge), as is a branch's run by hand: a newer push replaces the older run.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # What this run has to do: the version, whether it is a release, whether this code already passed, and whether a
  # run by hand already built and proved the installers.
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read  # to see whether the commit before this one, or the pull request merged here, passed ci
      pull-requests: read  # to find the pull request a push to main merged
    outputs:
      version: ${{ steps.plan.outputs.version }}
      new: ${{ steps.plan.outputs.new }}
      # A run of the real sign-ins alone skips everything else (as code already tested would), and builds no installers.
      installers: ${{ inputs.real_sign_in_only && 'false' || steps.plan.outputs.installers }}
      tested: ${{ inputs.real_sign_in_only && 'true' || steps.plan.outputs.tested }}
      reuse_run: ${{ steps.plan.outputs.reuse_run }}
      mac_signing: ${{ steps.signing.outputs.mac_signing }}
      mac_notarize: ${{ steps.signing.outputs.mac_notarize }}
      win_signing: ${{ steps.signing.outputs.win_signing }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # nothing here pushes; plan.sh's git fetch reads this public repository without a token
      # A run by hand keeps the exact tree it tests, so that merging that branch into main with the very same code
      # (main hadn't moved meanwhile) is known to have passed already (plan.sh).
      # (Not a run of the real sign-ins alone, which tests nothing else.)
      - if: github.event_name == 'workflow_dispatch' && !inputs.real_sign_in_only
        run: git rev-parse 'HEAD^{tree}' > tested-tree.txt
      - if: github.event_name == 'workflow_dispatch' && !inputs.real_sign_in_only
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: tested-tree
          path: tested-tree.txt
          retention-days: 30
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          REPO: ${{ github.repository }}
          WANT_INSTALLERS: ${{ inputs.installers }}
          REUSE_RUN: ${{ inputs.reuse_run }}
        run: bash .github/scripts/plan.sh
      # Which secrets exist (only that: no value comes here) decides whether the installers are signed.
      - id: signing
        env:
          EVENT_NAME: ${{ github.event_name }}
          INSTALLERS: ${{ steps.plan.outputs.installers }}
          TEST_SIGNING: ${{ inputs.test_signing }}
          MACOS_CERT_P12_BASE64_SET: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
          MACOS_CERT_PASSWORD_SET: ${{ secrets.MACOS_CERT_PASSWORD != '' }}
          APPLE_TEAM_ID_SET: ${{ secrets.APPLE_TEAM_ID != '' }}
          APPLE_NOTARY_KEY_P8_BASE64_SET: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 != '' }}
          APPLE_NOTARY_KEY_ID_SET: ${{ secrets.APPLE_NOTARY_KEY_ID != '' }}
          APPLE_NOTARY_ISSUER_ID_SET: ${{ secrets.APPLE_NOTARY_ISSUER_ID != '' }}
          AZURE_TENANT_ID_SET: ${{ secrets.AZURE_TENANT_ID != '' }}
          AZURE_CLIENT_ID_SET: ${{ secrets.AZURE_CLIENT_ID != '' }}
          AZURE_CLIENT_SECRET_SET: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
          WINDOWS_SIGNING_ENDPOINT_SET: ${{ secrets.WINDOWS_SIGNING_ENDPOINT != '' }}
          WINDOWS_SIGNING_ACCOUNT_SET: ${{ secrets.WINDOWS_SIGNING_ACCOUNT != '' }}
          WINDOWS_SIGNING_PROFILE_SET: ${{ secrets.WINDOWS_SIGNING_PROFILE != '' }}
          WINDOWS_CERT_PFX_BASE64_SET: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
          WINDOWS_CERT_PASSWORD_SET: ${{ secrets.WINDOWS_CERT_PASSWORD != '' }}
        run: bash .github/scripts/signing-plan.sh plan

  # The desktop app's connection rules (docs/ARCHITECTURE.md), counted: a fixed wait, a screen keeping its own copy of
  # the AI's state, a window built by hand, an error swallowed. A count that goes up fails; the toolkit is the way instead.
  # And the scripts a student or a release runs but no other job here does parse: the one-line installers (install.sh,
  # install.ps1) and the Windows build and signing scripts (PowerShell 7, which this Linux runner has).
  connections:
    name: Connection rules (counts only go down), and the scripts parse
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: bash tools/check-connections.sh
      # Finder never opened the DMG's window while this layout held data where it expects dictionaries.
      - name: The Mac disk's Finder layout (macos/dmg-layout.DS_Store) holds dictionaries
        run: |
          python3 -m venv "$RUNNER_TEMP/ds"
          "$RUNNER_TEMP/ds/bin/pip" install --quiet ds_store==1.3.1
          "$RUNNER_TEMP/ds/bin/python" -I tools/dmg/check_ds_store.py macos/dmg-layout.DS_Store
      - name: install.sh, install.ps1, windows/*.ps1 and the Velopack scripts parse
        shell: pwsh
        run: |
          foreach ($sh in @("install.sh") + @(Get-ChildItem macos, linux, tools/velopack -Filter *.sh | ForEach-Object FullName)) {
            sh -n $sh
            if ($LASTEXITCODE -ne 0) { throw "$sh doesn't parse" }
          }
          foreach ($py in @(Get-ChildItem tools/velopack -Filter *.py)) {
            python3 -m py_compile $py.FullName
            if ($LASTEXITCODE -ne 0) { throw "$($py.Name) doesn't parse" }
          }
          foreach ($file in @(Get-Item install.ps1) + @(Get-ChildItem windows -Filter *.ps1) + @(Get-ChildItem tools/velopack -Filter *.ps1)) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$($file.Name) doesn't parse: $errors" }
          }

  # The C# engine (engine/): every test on each system. Golden/ holds fixed expectations the tests compare byte for
  # byte. macOS and Linux run both test projects (Core, then App) in one job: GitHub runs at most five macOS jobs at
  # once, and a run that took five made the next one queue. Windows keeps them in two jobs side by side, as its App
  # tests are the slowest anywhere (about 20 minutes).
  # Then, in each leg that ran the App tests, every AI sign-in with no terminal, proved with the real CLIs: Claude Code,
  # Codex and Antigravity CLI (Gemini), each installed the way the app installs it (its maker's installer) in a home of
  # the run's own, then signed in with the app's own hidden sign-in (a pseudo-terminal nobody sees; ConPTY on Windows)
  # until it waits for the browser, and stopped (RealCliSignInTests). No account is used and nothing finishes; the app's
  # browser opener is replaced and the system's are stand-ins, so nothing opens from the app; on Windows no window of
  # the sign-in's own may show. Then Connect's own step adds Syft Notes to that AI's apps in the run's home, the real CLI
  # is asked what it sees (claude mcp list, codex mcp list, agy mcp list where it has one), and the server each app's
  # settings name is started exactly as written there and lists its tools (RealCliConnect.cs); the Claude app's
  # settings are a copy of each computer's real layout (on Windows the Store build after it moved its data). On
  # Windows, Git for Windows is out of reach for all of it, as on a student's PC. The log says only yes or no for each
  # (needed a terminal, prompts answered, waiting for the browser, a window, connected, listed), never an address, a
  # code or a token. A CLI whose download fails for the network is skipped and said so. It's the makers' CLIs as they
  # are today, so a failure there is reported (on the step, and on the run's page) but fails neither the job nor a
  # release.
  engine:
    name: Engine ${{ matrix.suite }} tests (${{ matrix.os }})
    needs: [version]
    if: needs.version.outputs.tested != 'true'
    strategy:
      fail-fast: false  # a flake in one doesn't hide the rest, and re-running a failed job re-runs only it
      # A pull request runs the Linux leg alone; a push to main and a run by hand run all four.
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"os":"ubuntu-latest","suite":"Core and App","slug":"all","core":true,"app":true}]'
          || '[{"os":"ubuntu-latest","suite":"Core and App","slug":"all","core":true,"app":true},
          {"os":"macos-latest","suite":"Core and App","slug":"all","core":true,"app":true},
          {"os":"windows-latest","suite":"Core","slug":"core","core":true,"app":false},
          {"os":"windows-latest","suite":"App","slug":"app","core":false,"app":true}]') }}
    # Measured: Linux 2 + 14 to 17 minutes, macOS 4 + 20 to 25, Windows Core 10 to 14, Windows App 16 to 22, and the real
    # sign-ins 2 to 3 more. The limits only bound a hang.
    timeout-minutes: ${{ matrix.suite == 'Core' && 25 || 45 }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/dotnet
        with:
          packages: engine-${{ matrix.slug }}
      - uses: ./.github/actions/whisper-tiny
      - name: Where a crashed test process leaves its report
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/crash"
      # Linux: a real sound server with a stand-in microphone, so the Core tests record through PulseAudio itself.
      - name: PulseAudio, with a microphone that hears silence
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends pulseaudio pulseaudio-utils libpulse0
          pulseaudio -D --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=speakers
          pactl load-module module-null-sink sink_name=mic
          pactl set-default-sink speakers
          pactl set-default-source mic.monitor
      - name: Run the Core tests
        id: core
        if: matrix.core
        # Each test's result goes to a .trx file for the run's page (below), a test that hangs 10 minutes is dumped and
        # stopped (so the job fails and says which, instead of running out of time), and a crash leaves a dump.
        run: >-
          dotnet test engine/tests/StudyStash.Core.Tests --logger "trx;LogFileName=Core.trx"
          --results-directory "${{ runner.temp }}/test-results"
          --blame-hang-timeout 10m --blame-hang-dump-type mini --blame-crash --blame-crash-dump-type mini
        env:
          # Linux: record through the PulseAudio started above.
          STUDYSTASH_PULSE_TESTS: ${{ runner.os == 'Linux' && '1' || '' }}
          # Windows: also run the library as a real background service, from the Startup folder with no window.
          STUDYSTASH_LIVE_SERVICE: ${{ runner.os == 'Windows' && '1' || '' }}
          # A test process that dies in native code leaves a crash report (every thread's stack, native and .NET)
          # instead of only "exit code 139", so a crash that happens once in a while can be traced the first time.
          DOTNET_DbgEnableMiniDump: ${{ runner.os != 'Windows' && '1' || '' }}
          DOTNET_DbgMiniDumpType: ${{ runner.os != 'Windows' && '1' || '' }}
          DOTNET_EnableCrashReport: ${{ runner.os != 'Windows' && '1' || '' }}
          DOTNET_DbgMiniDumpName: ${{ runner.os != 'Windows' && format('{0}/crash/core.%p', runner.temp) || '' }}
      # The App tests ran on a Linux runner with no sound server of the Core tests' own: stopped, so they still do.
      - name: Linux - the Core tests' PulseAudio stopped
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: pulseaudio --kill || true
      # After the Core tests even when they failed, so one run shows everything that's wrong.
      - name: Run the App tests
        id: app
        if: ${{ !cancelled() && matrix.app }}
        shell: bash
        # Two processes at once (headless Avalonia has one UI thread a process): the slow classes in slow-lane.txt in one,
        # the rest in the other, each with its own .trx. On Linux this also checks the pictures of the screens
        # (Snapshots); the other systems skip them.
        run: >-
          tools/run-app-tests.sh "$RUNNER_TEMP/test-results"
          --blame-hang-timeout 10m --blame-hang-dump-type mini --blame-crash --blame-crash-dump-type mini
        env:
          DOTNET_DbgEnableMiniDump: ${{ runner.os != 'Windows' && '1' || '' }}
          DOTNET_DbgMiniDumpType: ${{ runner.os != 'Windows' && '1' || '' }}
          DOTNET_EnableCrashReport: ${{ runner.os != 'Windows' && '1' || '' }}
          DOTNET_DbgMiniDumpName: ${{ runner.os != 'Windows' && format('{0}/crash/core.%p', runner.temp) || '' }}
      # A student's PC has no Git for Windows: its folder is moved aside and it's taken off the PATH for the sign-ins and
      # Connect, then put back (the steps after it, and the checkout's own clean-up, use it).
      - name: Windows - Git for Windows out of reach
        if: ${{ !cancelled() && matrix.app && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          "GIT_KEPT_PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $git = Join-Path $env:ProgramFiles 'Git'
          if (Test-Path $git) { Rename-Item $git 'Git-out-of-reach' }
          $path = ($env:PATH -split ';' | Where-Object { $_ -notmatch '\\Git\\' }) -join ';'
          "PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      # The App tests above built what this runs.
      - name: Each real AI's sign-in, in the hidden terminal, then Connect against what each reads (the makers' CLIs as they are today, so not one the run waits for)
        id: real-sign-in
        if: ${{ !cancelled() && matrix.app && github.event_name != 'pull_request' }}
        continue-on-error: true
        timeout-minutes: 12
        shell: pwsh
        run: dotnet test engine/tests/StudyStash.App.Tests --no-build --filter "FullyQualifiedName~RealCliSignInTests"
        env:
          STUDYSTASH_REAL_CLIS: "1"
          STUDYSTASH_REAL_CLIS_DIR: ${{ runner.temp }}/real-sign-in
      - name: Windows - Git for Windows back
        if: always() && matrix.app && runner.os == 'Windows'
        shell: pwsh
        run: |
          $kept = Join-Path $env:ProgramFiles 'Git-out-of-reach'
          if (Test-Path $kept) { Rename-Item $kept 'Git' }
          if ($env:GIT_KEPT_PATH) { "PATH=$env:GIT_KEPT_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
      - name: What each real sign-in did
        if: ${{ !cancelled() && matrix.app && github.event_name != 'pull_request' }}
        shell: bash
        env:
          OUTCOME: ${{ steps.real-sign-in.outcome }}
        run: |
          summary=$(cat "$RUNNER_TEMP/real-sign-in/summary.txt" 2>/dev/null || echo "no summary was written")
          echo "$summary"
          {
            echo "### Real sign-ins and Connect ($RUNNER_OS): $OUTCOME"
            echo '```'
            echo "$summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$OUTCOME" = failure ]; then echo "::warning::The real sign-ins failed on $RUNNER_OS (not counted against the run): see the step above."; fi
      # The tests that failed, and the 20 slowest, on the run's page (an in-repo script: no reporter action, no extra
      # permission).
      - name: Test results on the run's page
        if: ${{ !cancelled() }}
        shell: bash
        env:
          TITLE: Engine ${{ matrix.suite }} tests (${{ runner.os }})
        run: |
          if [ "$RUNNER_OS" = Windows ]; then py=python; else py=python3; fi
          "$py" .github/scripts/test-summary.py "$TITLE" "$RUNNER_TEMP/test-results"
      # Only when something failed: the .trx files, a hung test's dump, a crashed test process's dump and crash report.
      - name: Test results and dumps, if a test failed, hung or crashed
        if: failure()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.slug }}
          path: |
            ${{ runner.temp }}/test-results
            ${{ runner.temp }}/crash
          retention-days: 7
          if-no-files-found: ignore
      # A picture check that failed: what the screen drew now (*.received.png) beside the picture kept for it
      # (*.verified.png), so the difference can be looked at. Copy the received one over the verified one if it's meant.
      - name: Pictures of the screens, if a picture check failed
        if: ${{ failure() && runner.os == 'Linux' && matrix.app && hashFiles('engine/tests/StudyStash.App.Tests/Snapshots/*.received.png') != '' }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: snapshot-pictures
          path: |
            engine/tests/StudyStash.App.Tests/Snapshots/*.received.png
            engine/tests/StudyStash.App.Tests/Snapshots/*.verified.png
          retention-days: 7
          if-no-files-found: ignore

  # Only for a run by hand with "real_sign_in_only": the real sign-ins above, alone, and what each showed, every
  # address, email and anything like a code or a key already taken out by the test, kept for a day to write the tests'
  # recordings from. Nothing else runs, so the run proves nothing else.
  real-sign-in:
    name: Real sign-ins, hidden, and Connect (${{ matrix.os }})
    needs: [version]
    if: inputs.real_sign_in_only
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    # About 7 to 11 minutes, most of it building; 20 only bounds a hang.
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/dotnet
        with:
          packages: engine-${{ runner.os == 'Windows' && 'app' || 'all' }}
      - name: Build the app's tests
        run: dotnet build engine/tests/StudyStash.App.Tests
      - name: Windows - Git for Windows out of reach
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "GIT_KEPT_PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $git = Join-Path $env:ProgramFiles 'Git'
          if (Test-Path $git) { Rename-Item $git 'Git-out-of-reach' }
          $path = ($env:PATH -split ';' | Where-Object { $_ -notmatch '\\Git\\' }) -join ';'
          "PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Each real AI's sign-in, in the hidden terminal, then Connect against what each reads
        shell: pwsh
        run: dotnet test engine/tests/StudyStash.App.Tests --no-build --filter "FullyQualifiedName~RealCliSignInTests"
        env:
          STUDYSTASH_REAL_CLIS: "1"
          STUDYSTASH_REAL_CLIS_DIR: ${{ runner.temp }}/real-sign-in
          STUDYSTASH_REAL_CLIS_RECORD: "1"
      - name: Windows - Git for Windows back
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $kept = Join-Path $env:ProgramFiles 'Git-out-of-reach'
          if (Test-Path $kept) { Rename-Item $kept 'Git' }
          if ($env:GIT_KEPT_PATH) { "PATH=$env:GIT_KEPT_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
      - name: What each did
        if: always()
        shell: bash
        run: cat "$RUNNER_TEMP/real-sign-in/summary.txt" 2>/dev/null || echo "no summary was written"
      - name: What each showed, addresses taken out
        if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: real-sign-in-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/real-sign-in/transcripts
            ${{ runner.temp }}/real-sign-in/install-*.log
          retention-days: 1
          if-no-files-found: ignore

  # The Mac app: one universal bundle for Apple silicon and Intel, started by its own launcher (D1); ad hoc signed with
  # the microphone entitlement; the DMG (D2). What ships is a student's copy, with no self-test, demo libraries or test
  # switches in it (macos/build-app.sh stops if they are, and the DMG is checked); the self-test (D5), where real
  # windows open, the pretend microphone records and Whisper (Metal) hears the speech from inside the bundle, runs a
  # copy of the same code built with them (--test-helpers), which is never shipped. Only a release uploads the DMG.
  # With the signing secrets (docs/signing.md) the student's app is signed with a Developer ID, notarized and stapled
  # right after the build, and the DMG made again around it. The copy with the test helpers is signed the same way
  # (not notarized), so the self-tests still run an app with library validation on.
  # Both self-tests (as a laptop, and as just this computer) run here, one after the other, on the one test copy built.
  mac-app:
    name: Mac app (self-test, DMG)
    needs: [version]
    if: github.event_name != 'pull_request' && (needs.version.outputs.tested != 'true' || (needs.version.outputs.installers == 'true' && needs.version.outputs.reuse_run == ''))
    # Notarization usually answers within minutes, but Apple's first answers for a new account can take much longer.
    timeout-minutes: ${{ needs.version.outputs.mac_signing == 'real' && 120 || (needs.version.outputs.mac_signing == 'rehearsal' && 45 || 30) }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/dotnet
        with:
          packages: mac-app
      - uses: ./.github/actions/whisper-tiny
        if: needs.version.outputs.tested != 'true'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The phone app (web/), which the library serves at /app/, in a step of its own: npm's packages run their install
      # scripts here, where no secret is in reach. The builds after it use web/dist as it is (STUDYSTASH_SKIP_WEB).
      - name: The phone app (web/), built with no secret in reach
        shell: bash
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      # No secret: this copy is never shipped.
      - name: Build the copy the self-tests run (with the test helpers; never shipped)
        env:
          STUDYSTASH_SKIP_WEB: "1"
        run: sh macos/build-app.sh --test-helpers dist/mac-test
      - name: Build Syft Notes.app and its one DMG - the student's copy, with no test helpers
        # The laptop's Google sign-in secret (docs/phone-google.md) is built into the app; without it the app builds as
        # usual and Connect with Google says this copy can't connect.
        env:
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
          STUDYSTASH_SKIP_WEB: "1"
        run: sh macos/build-app.sh dist/mac
      # Signing, only when the version job planned it. Each step that needs a secret has just its own.
      - name: Signing - the Developer ID certificate, in a keychain made for this run
        if: needs.version.outputs.mac_signing == 'real'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: sh macos/signing-setup.sh import
      - name: Signing - the notary key
        if: needs.version.outputs.mac_notarize == 'true'
        env:
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: sh macos/signing-setup.sh notary
      - name: Signing - a throwaway self-signed identity, for the rehearsal
        if: needs.version.outputs.mac_signing == 'rehearsal'
        run: sh macos/signing-setup.sh selfsigned
      # Velopack's packager (docs/LIBRARIES.md, phase 5): sign-release.sh packs the signed app with it, so the DMG holds
      # the bundle Velopack updates, and its feed goes out with the release.
      - name: vpk, Velopack's packager
        if: needs.version.outputs.mac_signing != 'off'
        run: |
          dotnet tool install -g vpk --version 1.2.161
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Sign the app, notarize it if there is a key, and make the DMG again around it (the test copy is signed too, never notarized)
        if: needs.version.outputs.mac_signing != 'off'
        env:
          # Set the repository variable STUDYSTASH_LIBRARY_VALIDATION to "off" to keep disable-library-validation (docs/signing.md).
          STUDYSTASH_LIBRARY_VALIDATION: ${{ vars.STUDYSTASH_LIBRARY_VALIDATION }}
        run: |
          STUDYSTASH_NOTARY_KEY='' STUDYSTASH_NOTARY_KEY_ID='' STUDYSTASH_NOTARY_ISSUER_ID='' sh macos/sign-release.sh dist/mac-test
          sh macos/sign-release.sh dist/mac
      - name: The signature is the one this run was told to make
        if: needs.version.outputs.mac_signing != 'off'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          STUDYSTASH_LIBRARY_VALIDATION: ${{ vars.STUDYSTASH_LIBRARY_VALIDATION }}
          HOW: ${{ needs.version.outputs.mac_signing == 'rehearsal' && 'rehearsal' || (needs.version.outputs.mac_notarize == 'true' && 'notarized' || 'signed') }}
        run: sh macos/verify-signing.sh "dist/mac/Syft Notes.app" dist/mac/Syft-Notes.dmg "$HOW"
      # As soon as the signature is checked (nothing after this signs), not at the end of the job: the self-tests and
      # everything else that runs the app never have the certificate or the notary key within reach.
      - name: Signing - the keychain and keys are removed
        if: always() && needs.version.outputs.mac_signing != 'off'
        run: sh macos/signing-setup.sh cleanup
      - name: The app carries the phone app, which the library serves at /app/
        run: |
          for arch in arm64 x64; do
            for f in index.html sw.js manifest.webmanifest; do
              test -f "dist/mac/Syft Notes.app/Contents/MacOS/$arch/web/$f" || { echo "no web/$f in the $arch tree"; exit 1; }
            done
          done
      - name: Each tree carries its own live words - Cactus Whistle (model, licence, its arm64 engine, signed) for Apple silicon, the small Whisper (model, licence) for Intel - and not the other's
        run: |
          arm="dist/mac/Syft Notes.app/Contents/MacOS/arm64"; intel="dist/mac/Syft Notes.app/Contents/MacOS/x64"
          for f in "$arm/models/whistle.cact" "$arm/needle/LICENSE.txt" "$arm/needle/osx-arm64/libneedle3.dylib" \
                   "$intel/models/live-whisper-tiny-q8_0.bin" "$intel/models/live-whisper-LICENSE.txt"; do
            test -f "$f" || { echo "no $f"; exit 1; }
          done
          [ "$(lipo -archs "$arm/needle/osx-arm64/libneedle3.dylib")" = arm64 ] || { echo "the arm64 tree's libneedle3.dylib isn't arm64"; exit 1; }
          codesign --verify --strict "$arm/needle/osx-arm64/libneedle3.dylib"
          if [ -e "$arm/models/live-whisper-tiny-q8_0.bin" ] || [ -e "$intel/models/whistle.cact" ] || [ -e "$intel/needle" ]; then
            echo "a tree carries the other processor's live words"; exit 1
          fi
      - name: Signed, universal, and reports its version on both architectures
        run: |
          APP="dist/mac/Syft Notes.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -info "$APP/Contents/MacOS/StudyStash" | grep -q "x86_64"
          lipo -info "$APP/Contents/MacOS/StudyStash" | grep -q "arm64"
          V=$(env -u DOTNET_ROOT "$APP/Contents/MacOS/StudyStash" version)
          [ -n "$V" ]
          softwareupdate --install-rosetta --agree-to-license 2>/dev/null || true
          [ "$(env -u DOTNET_ROOT arch -x86_64 "$APP/Contents/MacOS/StudyStash" version)" = "$V" ]
      # The copy built with the test helpers: the student's has no self-test to run.
      - name: Self-test (D5) - real windows, the pretend mic, Whisper from inside the bundle
        if: needs.version.outputs.tested != 'true'
        run: sh macos/selftest.sh "dist/mac-test/Syft Notes.app" "$RUNNER_TEMP/selftest/laptop"
      # The second self-test, on the same test copy (it used to build it again on a Mac of its own): Just this computer.
      # Then "Answer your phone when Syft Notes is closed" goes on with a stand-in phone (a real LaunchAgent, on this
      # throwaway Mac only), the app quits, and the library must still answer the phone, never be taken for the app
      # (opening Syft Notes still starts it), and leave nothing once removed.
      - name: Self-test, just this computer - setup makes the app's own library, the notes are written here, and the phone is answered with the app closed
        if: ${{ !cancelled() && needs.version.outputs.tested != 'true' }}
        env:
          STUDYSTASH_SELFTEST_FLOW: one-computer
          STUDYSTASH_SELFTEST_BACKGROUND: "1"
        run: |
          sh macos/selftest.sh "dist/mac-test/Syft Notes.app" "$RUNNER_TEMP/selftest/one-computer"
          grep -q "^background library registered" "$RUNNER_TEMP/selftest/one-computer/selftest.txt" || { echo "the self-test didn't turn on answering with the app closed"; exit 1; }
          grep -q "^the phone got its answer with the app closed" "$RUNNER_TEMP/selftest/one-computer/background.txt" || { echo "the phone wasn't answered with the app closed"; exit 1; }
          # The background library is never taken for the app: with it running, opening the app still starts it.
          grep -q "^opening Syft Notes with open starts it" "$RUNNER_TEMP/selftest/one-computer/background.txt" || { echo "with the background library running, opening Syft Notes didn't start it"; exit 1; }
          for agent in "$HOME/Library/LaunchAgents/"com.study-stash.background.*.plist; do
            [ ! -e "$agent" ] || { echo "a LaunchAgent was left behind"; ls "$HOME/Library/LaunchAgents"; exit 1; }
          done
      - name: The DMG holds the student's app - with no self-test in it - with no role of its own (setup asks), and no model is bundled (D6)
        run: |
          mnt="$RUNNER_TEMP/mnt-dmg"
          mkdir -p "$mnt"
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$mnt" dist/mac/Syft-Notes.dmg
          for arch in arm64 x64; do
            [ "$(perl -0777 -ne 'print /s\0e\0l\0f\0t\0e\0s\0t\0\.\0t\0x\0t/ ? "self-test" : "clean"' "$mnt/Syft Notes.app/Contents/Resources/$arch/StudyStash.dll")" = clean ] \
              || { hdiutil detach -quiet "$mnt"; echo "Syft-Notes.dmg's app ($arch) has the self-test in it" >&2; exit 1; }
          done
          if /usr/libexec/PlistBuddy -c "Print :StudyStashRole" "$mnt/Syft Notes.app/Contents/Info.plist" >/dev/null 2>&1; then
            hdiutil detach -quiet "$mnt"
            echo "Syft-Notes.dmg's app still says a role" >&2
            exit 1
          fi
          [ -L "$mnt/Applications" ]
          # The disk is HFS+ (Finder's saved layout, .DS_Store, is for it; an APFS disk never opened its window) and
          # holds that layout.
          diskutil info "$mnt" | grep -q "File System Personality: *HFS+" || { echo "the DMG's disk isn't HFS+"; diskutil info "$mnt"; exit 1; }
          [ -s "$mnt/.DS_Store" ] || { echo "the DMG has no Finder layout (.DS_Store)"; ls -la "$mnt"; exit 1; }
          # An older copy's updater looks for Study Stash.app on the disk: a hidden link to the app (macos/dmg.sh).
          [ "$(readlink "$mnt/Study Stash.app")" = "Syft Notes.app" ] || { echo "no Study Stash.app link for older updaters"; ls -la "$mnt"; exit 1; }
          [ -f "$mnt/Study Stash.app/Contents/Info.plist" ] || { echo "the Study Stash.app link doesn't reach the app"; ls -la "$mnt"; exit 1; }
          ls -lO "$mnt" | grep -F "Study Stash.app" | grep -q hidden || { echo "the Study Stash.app link isn't hidden"; ls -lO "$mnt"; exit 1; }
          # Bar the live words' small Whisper (models/live-whisper-*.bin, Intel only), which comes with the app.
          if find "$mnt" \( -iname 'ggml-*.bin' -o -name '*.bin' -size +1M \) ! -name 'live-whisper-*.bin' | grep -q .; then
            hdiutil detach -quiet "$mnt"
            echo "a model file is bundled in Syft-Notes.dmg" >&2
            exit 1
          fi
          hdiutil detach -quiet "$mnt"
      # Every DMG from 0.22.0 to 0.23.2 crashed Finder when a student opened it, and nothing here opened one.
      - name: Finder opens the DMG as a student's download, shows its window, and doesn't crash
        run: sh tools/dmg/opens-in-finder.sh dist/mac/Syft-Notes.dmg
      - uses: actions/upload-artifact@v7
        if: needs.version.outputs.installers == 'true'
        with:
          name: mac-installers
          path: |
            dist/mac/Syft-Notes.dmg
            dist/mac/velopack/osx
          retention-days: 30
      # The copy with the test helpers, for the Intel Mac's self-test: never published (the release job downloads
      # mac-installers only).
      - uses: actions/upload-artifact@v7
        if: needs.version.outputs.installers == 'true'
        with:
          name: mac-test-copy
          path: dist/mac-test/Syft-Notes.dmg
          retention-days: 1
      # What the self-test said and drew, every time; the whole folder (its home, recordings and a copy of the model:
      # 80 to 150 MB) only when something failed.
      - name: The self-test's words, logs and pictures
        uses: actions/upload-artifact@v7
        continue-on-error: true
        if: always() && needs.version.outputs.tested != 'true'
        with:
          name: mac-selftest
          path: |
            ${{ runner.temp }}/selftest/**/*.txt
            ${{ runner.temp }}/selftest/**/*.log
            ${{ runner.temp }}/selftest/*.png
            ${{ runner.temp }}/selftest/*/*.png
          retention-days: 7
      - name: The self-test's whole folder, as something failed
        uses: actions/upload-artifact@v7
        continue-on-error: true
        if: failure()
        with:
          name: mac-selftest-full
          path: |
            ${{ runner.temp }}/selftest
          retention-days: 7
      # How this run signed the installer, as the name of an artifact: a rehearsal's is never published or reused.
      - name: How the Mac installer was signed
        if: needs.version.outputs.installers == 'true'
        run: echo "${{ needs.version.outputs.mac_signing }}" > "$RUNNER_TEMP/mac-signing.txt"
      - uses: actions/upload-artifact@v7
        continue-on-error: true
        if: needs.version.outputs.installers == 'true'
        with:
          name: signing-mac-${{ needs.version.outputs.mac_signing }}
          path: ${{ runner.temp }}/mac-signing.txt
          retention-days: 30

  # The Intel self-test (D5), for real: a physical Intel Mac, so the x64 tree runs natively (mac-app already checked
  # it runs enough to print its version under Rosetta). A release only. The self-test runs the copy with the test
  # helpers; the student's copy (the DMG that ships) is checked as signed and must print its version, here.
  mac-intel:
    name: Mac app self-test (Intel)
    needs: [version, mac-app]
    if: needs.version.outputs.installers == 'true' && needs.version.outputs.reuse_run == ''
    timeout-minutes: 20
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: mac-installers
          path: dist/mac
      - uses: actions/download-artifact@v8
        with:
          name: mac-test-copy
          path: dist/mac-test
      - uses: ./.github/actions/whisper-tiny
      - name: Mount the DMGs and copy the apps out (artifacts lose exec bits, so they travel as DMGs)
        run: |
          for copy in mac mac-test; do
            mkdir -p "$RUNNER_TEMP/mnt-$copy" "$RUNNER_TEMP/$copy"
            hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$RUNNER_TEMP/mnt-$copy" "dist/$copy/Syft-Notes.dmg"
            ditto "$RUNNER_TEMP/mnt-$copy/Syft Notes.app" "$RUNNER_TEMP/$copy/Syft Notes.app"
            hdiutil detach -quiet "$RUNNER_TEMP/mnt-$copy"
            codesign --verify --deep --strict "$RUNNER_TEMP/$copy/Syft Notes.app"
          done
      - name: Signed as planned, and Gatekeeper accepts it, offline, on the Intel Mac that will run it
        if: needs.version.outputs.mac_signing != 'off'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          STUDYSTASH_LIBRARY_VALIDATION: ${{ vars.STUDYSTASH_LIBRARY_VALIDATION }}
          HOW: ${{ needs.version.outputs.mac_signing == 'rehearsal' && 'rehearsal' || (needs.version.outputs.mac_notarize == 'true' && 'notarized' || 'signed') }}
        run: sh macos/verify-signing.sh "$RUNNER_TEMP/mac/Syft Notes.app" dist/mac/Syft-Notes.dmg "$HOW"
      - name: The student's copy starts natively on Intel and prints its version
        run: |
          V=$(sed -n 's:.*<StudyStashVersion>\(.*\)</StudyStashVersion>.*:\1:p' engine/Directory.Build.props)
          [ "$(env -u DOTNET_ROOT "$RUNNER_TEMP/mac/Syft Notes.app/Contents/MacOS/StudyStash" version)" = "$V" ]
      - name: Self-test, natively on Intel (the copy with the test helpers)
        run: sh macos/selftest.sh "$RUNNER_TEMP/mac-test/Syft Notes.app" "$RUNNER_TEMP/selftest"
      # What the self-test said and drew, every time; the whole folder (its home, recordings and a copy of the model:
      # 80 to 150 MB) only when something failed.
      - name: The self-test's words, logs and pictures
        uses: actions/upload-artifact@v7
        continue-on-error: true
        if: always()
        with:
          name: mac-intel-selftest
          path: |
            ${{ runner.temp }}/selftest/**/*.txt
            ${{ runner.temp }}/selftest/**/*.log
            ${{ runner.temp }}/selftest/*.png
            ${{ runner.temp }}/selftest/*/*.png
          retention-days: 7
      - name: The self-test's whole folder, as something failed
        uses: actions/upload-artifact@v7
        continue-on-error: true
        if: failure()
        with:
          name: mac-intel-selftest-full
          path: |
            ${{ runner.temp }}/selftest
          retention-days: 7

  # The Windows app: one Setup.exe with no role of its own (setup asks). What ships is a student's copy, with no
  # self-test, demo libraries or test switches in it (windows\build.ps1 stops if they are); the self-tests (D5), as just
  # this computer and as a laptop, run a copy of the same code built with them (-TestHelpers), which is never shipped.
  # Both trees are built and checked. A merge stops there (the build leaves Setup.exe out). A release also builds
  # Setup.exe, installs it, checks the installed copy is the student's tree file for file, updates it in place with a
  # silent Setup.exe, and uninstalls it without touching lectures or settings outside the install folder. With the
  # signing secrets (docs/signing.md) the student's build leaves Setup.exe out, and a step after it signs the app's exe
  # and dlls and makes Setup.exe again, signed with its uninstaller; everything after that which runs the student's
  # copy (installing, updating, uninstalling) runs the signed files.
  windows-app:
    name: Windows app (self-test, Setup.exe)
    needs: [version]
    if: github.event_name != 'pull_request' && (needs.version.outputs.tested != 'true' || (needs.version.outputs.installers == 'true' && needs.version.outputs.reuse_run == ''))
    timeout-minutes: ${{ needs.version.outputs.win_signing != 'off' && 40 || 25 }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/dotnet
        with:
          packages: windows-app
      - name: Inno Setup 6, if this image lacks it
        if: needs.version.outputs.installers == 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: A merge ships nothing, so Inno Setup is put aside and the build leaves Setup.exe out
        if: needs.version.outputs.installers != 'true'
        shell: pwsh
        run: |
          # windows\build.ps1 builds Setup.exe only where it finds Inno Setup 6, and says so when it doesn't.
          $iscc = @((Get-Command iscc -ErrorAction SilentlyContinue).Source,
                    "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          foreach ($exe in $iscc) {
            if ($exe -and (Test-Path $exe)) { Write-Host "putting $exe aside"; Rename-Item $exe "$(Split-Path -Leaf $exe).aside" }
          }
      - uses: ./.github/actions/whisper-tiny
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The phone app (web/), which the library serves at /app/, in a step of its own: npm's packages run their install
      # scripts here, where no secret is in reach. The builds after it use web/dist as it is (STUDYSTASH_SKIP_WEB).
      - name: The phone app (web/), built with no secret in reach
        shell: bash
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      # No secret: this copy is never shipped.
      - name: Build the copy the self-tests run (win-x64, with the test helpers; never shipped)
        shell: pwsh
        env:
          STUDYSTASH_SKIP_WEB: "1"
        run: .\windows\build.ps1 -Out dist\windows-test -TestHelpers -NoInstaller -Rids win-x64
      - name: Build win-x64 and win-arm64, and Syft-Notes-Setup.exe - the student's copy, with no test helpers
        shell: pwsh
        # The laptop's Google sign-in secret, built into the app as on the Mac.
        env:
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
          STUDYSTASH_SKIP_WEB: "1"
        run: .\windows\build.ps1 -Out dist\windows ${{ needs.version.outputs.win_signing != 'off' && '-NoInstaller' || '' }}
      # Signing, only when the version job planned it. The secrets reach just the one step that signs.
      - name: Signing - a throwaway self-signed certificate, for the rehearsal
        if: needs.version.outputs.win_signing == 'rehearsal'
        shell: pwsh
        run: .\windows\signing-setup.ps1 -SelfSigned
      - name: Signing - .NET 8, which Azure Artifact Signing's signtool plugin runs on
        if: needs.version.outputs.win_signing == 'real'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Sign the app's files, then make Setup.exe again, signed with its uninstaller
        if: needs.version.outputs.win_signing == 'real'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          WINDOWS_SIGNING_ENDPOINT: ${{ secrets.WINDOWS_SIGNING_ENDPOINT }}
          WINDOWS_SIGNING_ACCOUNT: ${{ secrets.WINDOWS_SIGNING_ACCOUNT }}
          WINDOWS_SIGNING_PROFILE: ${{ secrets.WINDOWS_SIGNING_PROFILE }}
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: .\windows\sign-release.ps1 -Out dist\windows
      - name: Sign the app's files, then make Setup.exe again, signed with its uninstaller (the rehearsal's certificate)
        if: needs.version.outputs.win_signing == 'rehearsal'
        shell: pwsh
        run: .\windows\sign-release.ps1 -Out dist\windows
      # Velopack's packages (docs/LIBRARIES.md, phase 5): Setup.exe per processor, which an Inno-era copy moves over
      # with, and the update feed. Signed by vpk with the same identity (Artifact Signing through its own flag).
      - name: vpk, Velopack's packager
        if: needs.version.outputs.installers == 'true'
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version 1.2.161
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.dotnet\tools"
      - name: Velopack's Setup.exe and update packages, signed as Setup.exe is
        if: needs.version.outputs.installers == 'true' && needs.version.outputs.win_signing == 'real'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          WINDOWS_SIGNING_ENDPOINT: ${{ secrets.WINDOWS_SIGNING_ENDPOINT }}
          WINDOWS_SIGNING_ACCOUNT: ${{ secrets.WINDOWS_SIGNING_ACCOUNT }}
          WINDOWS_SIGNING_PROFILE: ${{ secrets.WINDOWS_SIGNING_PROFILE }}
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: .\windows\velopack-pack.ps1 -Out dist\windows
      - name: Velopack's Setup.exe and update packages (the rehearsal's certificate, or unsigned as Setup.exe is)
        if: needs.version.outputs.installers == 'true' && needs.version.outputs.win_signing != 'real'
        shell: pwsh
        run: .\windows\velopack-pack.ps1 -Out dist\windows
      - name: The signature is the one this run was told to make
        if: needs.version.outputs.win_signing != 'off'
        shell: pwsh
        env:
          HOW: ${{ needs.version.outputs.win_signing }}
        run: |
          $check = @{}
          if ($env:HOW -eq "rehearsal") { $check.Rehearsal = $true }
          .\windows\verify-signing.ps1 @check dist\windows\Syft-Notes-Setup.exe dist\windows\velopack\win-x64\SyftNotes-win-x64-Setup.exe dist\windows\velopack\win-arm64\SyftNotes-win-arm64-Setup.exe dist\windows\win-x64\StudyStash.exe dist\windows\win-arm64\StudyStash.exe dist\windows\win-x64\StudyStash.Core.dll dist\windows\win-x64\libSkiaSharp.dll
      - name: Both trees carry the phone app, which the library serves at /app/
        shell: pwsh
        run: |
          foreach ($rid in "win-x64", "win-arm64") {
            foreach ($f in "index.html", "sw.js", "manifest.webmanifest") {
              if (-not (Test-Path "dist\windows\$rid\web\$f")) { throw "no web\$f in the $rid tree" }
            }
          }
      - name: Each tree carries its own live words - Cactus Whistle (model, licence, its arm64 engine) on ARM, the small Whisper (model, licence) on x64 - and not the other's
        shell: pwsh
        run: |
          foreach ($f in "win-arm64\models\whistle.cact", "win-arm64\needle\LICENSE.txt", "win-arm64\needle\win-arm64\libneedle3.dll",
                         "win-x64\models\live-whisper-tiny-q8_0.bin", "win-x64\models\live-whisper-LICENSE.txt") {
            if (-not (Test-Path "dist\windows\$f")) { throw "no $f" }
          }
          $bytes = [IO.File]::ReadAllBytes("dist\windows\win-arm64\needle\win-arm64\libneedle3.dll")
          $built = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3C) + 4)
          if ($built -ne 0xAA64) { throw "win-arm64's libneedle3.dll is built for machine 0x$('{0:X}' -f $built), not 0xAA64" }
          foreach ($f in "win-arm64\models\live-whisper-tiny-q8_0.bin", "win-x64\models\whistle.cact", "win-x64\needle") {
            if (Test-Path "dist\windows\$f") { throw "${f}: a tree carries the other processor's live words" }
          }
      - name: Reports the version from Directory.Build.props, and no model is bundled (D6)
        shell: pwsh
        run: |
          $V = (Select-String -Path engine\Directory.Build.props -Pattern '<StudyStashVersion>(.*)</StudyStashVersion>').Matches[0].Groups[1].Value
          if (-not $V) { throw "no StudyStashVersion in engine/Directory.Build.props" }
          $printed = (& "dist\windows\win-x64\StudyStash.exe" version | Out-String).Trim()
          if ($printed -ne $V) { throw "version printed '$printed', expected '$V'" }
          echo "V=$V" >> $env:GITHUB_ENV
          # Bar the live words' small Whisper (models\live-whisper-*.bin, x64 only), which comes with the app.
          $bad = Get-ChildItem dist\windows -Recurse -File -Filter "*.bin" -ErrorAction SilentlyContinue | Where-Object { $_.Length -gt 1MB -and $_.Name -notlike "live-whisper-*.bin" }
          if ($bad) { throw "a model file is bundled: $($bad.FullName -join ', ')" }
      - name: Both trees carry the notes' formula and diagram code, its native parts built for their own processor, and no debug symbols
        shell: pwsh
        run: |
          foreach ($tree in @(@("win-x64", 0x8664), @("win-arm64", 0xAA64))) {
            $rid = $tree[0]; $machine = $tree[1]
            foreach ($f in "CSharpMath.SkiaSharp.dll", "CSharpMath.Rendering.dll", "Svg.Skia.dll", "Microsoft.Msagl.dll", "Markdig.dll", "SkiaSharp.dll", "HarfBuzzSharp.dll") {
              if (-not (Test-Path "dist\windows\$rid\$f")) { throw "$rid has no $f" }
            }
            foreach ($f in "libSkiaSharp.dll", "libHarfBuzzSharp.dll") {
              $bytes = [IO.File]::ReadAllBytes("dist\windows\$rid\$f")
              $built = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3C) + 4)
              if ($built -ne $machine) { throw "$rid\$f is built for machine 0x$('{0:X}' -f $built), not 0x$('{0:X}' -f $machine)" }
            }
            $symbols = @(Get-ChildItem "dist\windows\$rid" -Recurse -File -Filter "*.pdb")
            if ($symbols.Count -gt 0) { throw "$rid carries debug symbols: $($symbols.Name -join ', ')" }
          }
      - name: Self-test, just this computer - setup makes the app's own library, the notes are written here, and quitting stops it
        if: needs.version.outputs.tested != 'true'
        shell: pwsh
        timeout-minutes: 12
        run: |
          $selftestHome = "$env:RUNNER_TEMP\selftest-home-one-computer"
          $out = "$env:RUNNER_TEMP\selftest\one-computer"
          New-Item -ItemType Directory -Force -Path $selftestHome, $out | Out-Null
          $env:STUDYSTASH_SELFTEST = $out
          $env:STUDYSTASH_SELFTEST_FLOW = "one-computer"
          # Ends with "Answer your phone when Syft Notes is closed" on (a real Run key value, on this throwaway PC only).
          $env:STUDYSTASH_SELFTEST_BACKGROUND = "1"
          $env:STUDYSTASH_MIC_FILE = (Resolve-Path "engine\tests\StudyStash.Core.Tests\Fixtures\speech.wav").Path
          $env:STUDYSTASH_MIC_SPEED = "4"
          $env:STUDYSTASH_MODEL_FILE = $env:STUDYSTASH_WHISPER_MODEL
          $exe = (Resolve-Path "dist\windows-test\win-x64\StudyStash.exe").Path
          $p = Start-Process -FilePath $exe -ArgumentList "--home", $selftestHome -PassThru
          if (-not $p.WaitForExit(480000)) { $p.Kill(); throw "Syft Notes didn't exit within 480 s" }
          # The app has quit: its library must still answer the phone in the background, then go cleanly once removed.
          # Run whatever happened above, so the Run key value it made is always taken away again.
          $env:STUDYSTASH_SELFTEST_AFTER_QUIT = "1"
          $b = Start-Process -FilePath $exe -ArgumentList "--home", $selftestHome -PassThru
          if (-not $b.WaitForExit(300000)) { $b.Kill(); throw "the after-quit check didn't finish within 300 s" }
          Remove-Item Env:STUDYSTASH_SELFTEST_AFTER_QUIT
          $lines = Get-Content "$out\selftest.txt"
          $lines | Write-Host
          Write-Host "--- background.txt"
          $background = Get-Content "$out\background.txt"
          $background | Write-Host
          if (Test-Path "$selftestHome\logs\library.log") { Write-Host "--- library.log"; Get-Content "$selftestHome\logs\library.log" -Tail 40 | Write-Host }
          if ($p.ExitCode -ne 0) { throw "exit code $($p.ExitCode)" }
          if ($b.ExitCode -ne 0 -or $background[-1] -ne "ok") { throw "the phone wasn't answered with the app closed, or something was left behind" }
          if (-not ($lines -match "^background library registered")) { throw "the self-test didn't turn on answering with the app closed" }
          if (-not ($background -match "^the phone got its answer with the app closed")) { throw "the phone wasn't answered with the app closed" }
          $run = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -ErrorAction SilentlyContinue
          if ($run -and ($run.PSObject.Properties.Name -like "Syft Notes background*")) { throw "a Run key value was left behind" }
          if ($lines[-1] -ne "ok") { throw "last line was not ok" }
          if ($lines -match "heard nothing|no model|recording didn't start|FAILED") { throw "the self-test reported a problem" }
          if (-not ($lines -match "just this computer")) { throw "the self-test didn't run Just this computer" }
          if (-not ($lines -match "notes written on this computer by its own library")) { throw "the notes weren't written by this computer's own library" }
          # The library ran as the app's own child (StudyStash.exe serve): quitting the app stops it too.
          $left = @(Get-Process -Name StudyStash -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe })
          if ($left.Count -gt 0) {
            $left | Wait-Process -Timeout 20 -ErrorAction SilentlyContinue
            $left = @(Get-Process -Name StudyStash -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe })
          }
          if ($left.Count -ne 0) { $left | Stop-Process -Force; throw "the app's library (StudyStash.exe serve) was still running 20 s after the app quit" }
      - name: The installer puts Syft Notes on this account, with no role of its own (setup asks)
        if: needs.version.outputs.installers == 'true'
        shell: pwsh
        run: |
          Start-Process "dist\windows\Syft-Notes-Setup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          $app = "$env:LOCALAPPDATA\Programs\Study Stash"
          if (-not (Test-Path "$app\StudyStash.exe")) { throw "Syft Notes isn't installed" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Syft Notes.lnk")) { throw "no Start Menu entry" }
          if (Select-String -Path "$app\study-stash.ini" -Pattern "^\s*role\s*=" -Quiet) { throw "the one download wrote a role" }
          $printed = (& "$app\StudyStash.exe" version | Out-String).Trim()
          if ($printed -ne $env:V) { throw "installed version '$printed', expected '$env:V'" }
      - name: The installed copy is the student's win-x64 tree, file for file (native code and all), with no self-test in it
        if: needs.version.outputs.installers == 'true'
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\Study Stash"
          $tree = (Resolve-Path "dist\windows\win-x64").Path
          $missing = @(Get-ChildItem $tree -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring($tree.Length + 1)
            $there = Join-Path $app $rel
            if (-not (Test-Path $there) -or (Get-Item $there).Length -ne $_.Length) { $rel }
          })
          if ($missing.Count -gt 0) { throw "the installed copy lacks or differs in $($missing.Count) file(s): $($missing[0..9] -join ', ')" }
          $marker = [BitConverter]::ToString([Text.Encoding]::Unicode.GetBytes("selftest.txt"))
          if ([BitConverter]::ToString([IO.File]::ReadAllBytes("$app\StudyStash.dll")).Contains($marker)) { throw "the installed copy has the self-test in it" }
      - name: What the installer put there is signed too, and so is the uninstaller it wrote
        if: needs.version.outputs.win_signing != 'off'
        shell: pwsh
        env:
          HOW: ${{ needs.version.outputs.win_signing }}
        run: |
          $app = "$env:LOCALAPPDATA\Programs\Study Stash"
          $check = @{}
          if ($env:HOW -eq "rehearsal") { $check.Rehearsal = $true }
          .\windows\verify-signing.ps1 @check "$app\StudyStash.exe" "$app\unins000.exe" "$app\libSkiaSharp.dll"
      # The copy built with the test helpers: the installed one is a student's, with no self-test to run.
      - name: Self-test (D5), as a laptop - a lecture's formulas and flowchart draw
        if: needs.version.outputs.tested != 'true' || needs.version.outputs.installers == 'true'
        shell: pwsh
        run: |
          $selftestHome = "$env:RUNNER_TEMP\selftest-home"
          $out = "$env:RUNNER_TEMP\selftest"
          New-Item -ItemType Directory -Force -Path $selftestHome, $out | Out-Null
          $env:STUDYSTASH_SELFTEST = $out
          $env:STUDYSTASH_MIC_FILE = (Resolve-Path "engine\tests\StudyStash.Core.Tests\Fixtures\speech.wav").Path
          $env:STUDYSTASH_MIC_SPEED = "4"
          $env:STUDYSTASH_MODEL_FILE = $env:STUDYSTASH_WHISPER_MODEL
          $exe = (Resolve-Path "dist\windows-test\win-x64\StudyStash.exe").Path
          Write-Host "Self-testing $exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--home", $selftestHome -PassThru
          if (-not $p.WaitForExit(480000)) { $p.Kill(); throw "Syft Notes didn't exit within 480 s" }
          $lines = Get-Content "$out\selftest.txt"
          $lines | Write-Host
          if ($p.ExitCode -ne 0) { throw "exit code $($p.ExitCode)" }
          if ($lines[-1] -ne "ok") { throw "last line was not ok" }
          if ($lines -match "heard nothing|no model|recording didn't start|FAILED") { throw "the self-test reported a problem" }
          if (-not ($lines -match "^rich notes: .* typeset; a flowchart laid out")) { throw "the self-test didn't see the notes' formulas and flowchart drawn" }
          if (-not ($lines -match "^opened larger: ")) { throw "the self-test didn't open the flowchart larger" }
      - name: Installing again over an older role install (as an old copy's self-update does) is an in-place upgrade that keeps its role
        if: needs.version.outputs.installers == 'true'
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\Study Stash"
          # What an old Study-Stash-Library-Setup.exe left behind.
          "[app]`r`nrole=library`r`nversion=0.8.0`r`n" | Set-Content -NoNewline "$app\study-stash.ini"
          Start-Process "dist\windows\Syft-Notes-Setup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          if (-not (Select-String -Path "$app\study-stash.ini" -Pattern "role\s*=\s*library" -Quiet)) { throw "the old install's role was lost" }
          if (-not (Select-String -Path "$app\study-stash.ini" -Pattern "version\s*=\s*$env:V" -Quiet)) { throw "study-stash.ini doesn't say $env:V" }
          $entries = @(Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq "Syft Notes" })
          if ($entries.Count -ne 1) { throw "expected one uninstall entry for Syft Notes, found $($entries.Count)" }
      - name: A silent update (relaunch=1) starts the app again from the same folder
        if: needs.version.outputs.installers == 'true'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $app = "$env:LOCALAPPDATA\Programs\Study Stash"
          $updateHome = "$env:RUNNER_TEMP\update-home"
          New-Item -ItemType Directory -Force -Path $updateHome | Out-Null
          $old = Start-Process -FilePath "$app\StudyStash.exe" -ArgumentList "--home", $updateHome, "--background" -PassThru
          # It's running (a process that is gone already would make the rest of this prove nothing); the installer finds it by its file.
          if ($old.WaitForExit(0)) { throw "StudyStash.exe quit by itself right after starting (exit code $($old.ExitCode))" }
          # Windows says when a StudyStash.exe starts: queued from here on, so one that starts before the wait begins is still seen.
          Register-CimIndicationEvent -Query "SELECT * FROM Win32_ProcessStartTrace WHERE ProcessName = 'StudyStash.exe'" -SourceIdentifier started | Out-Null
          # Wait for the installer only: -Wait would also wait for the app it relaunches, which keeps running.
          $setup = Start-Process "dist\windows\Syft-Notes-Setup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CLOSEAPPLICATIONS", "/relaunch=1" -PassThru
          if (-not $setup.WaitForExit(240000)) { $setup.Kill(); throw "the silent update didn't finish within 240 s" }
          # A new process (not the one the installer stopped) running from the same folder.
          $deadline = [DateTime]::UtcNow.AddSeconds(30)
          $ok = $false
          while ($true) {
            if (Get-Process -Name StudyStash -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq "$app\StudyStash.exe" -and $_.Id -ne $old.Id }) { $ok = $true; break }
            $remaining = [int]($deadline - [DateTime]::UtcNow).TotalSeconds
            if ($remaining -le 0 -or -not (Wait-Event -SourceIdentifier started -Timeout $remaining)) { break }
            Remove-Event -SourceIdentifier started
          }
          Unregister-Event -SourceIdentifier started
          if (-not $ok) { throw "no new StudyStash.exe from $app running within 30 s of the silent update" }
          Get-Process -Name StudyStash -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Uninstalling removes only the app; lectures and settings stay
        if: needs.version.outputs.installers == 'true'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $app = "$env:LOCALAPPDATA\Programs\Study Stash"
          $settingsKeep = "$env:USERPROFILE\.study-stash\keep.txt"
          $lectureKeep = "$env:USERPROFILE\Documents\Study Stash\CS 101\keep.txt"
          New-Item -ItemType Directory -Force -Path (Split-Path $settingsKeep), (Split-Path $lectureKeep) | Out-Null
          "keep" | Out-File $settingsKeep
          "keep" | Out-File $lectureKeep
          # Windows says when the app's folder is deleted (queued from here on): the uninstaller hands the work to a copy of itself and quits.
          $watch = [IO.FileSystemWatcher]::new((Split-Path $app))
          $watch.NotifyFilter = [IO.NotifyFilters]::DirectoryName
          $watch.EnableRaisingEvents = $true
          Register-ObjectEvent -InputObject $watch -EventName Deleted -SourceIdentifier appgone | Out-Null
          Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
          $deadline = [DateTime]::UtcNow.AddSeconds(60)
          $gone = $false
          while ($true) {
            if (-not (Test-Path $app)) { $gone = $true; break }
            $remaining = [int]($deadline - [DateTime]::UtcNow).TotalSeconds
            if ($remaining -le 0 -or -not (Wait-Event -SourceIdentifier appgone -Timeout $remaining)) { break }
            Remove-Event -SourceIdentifier appgone
          }
          Unregister-Event -SourceIdentifier appgone
          $watch.Dispose()
          if (-not $gone) { throw "$app is still there 60 s after uninstalling" }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Syft Notes.lnk") { throw "the Start Menu entry survived" }
          if (-not (Test-Path $settingsKeep)) { throw "settings outside the app folder were deleted" }
          if (-not (Test-Path $lectureKeep)) { throw "a lecture outside the app folder was deleted" }
      - uses: actions/upload-artifact@v7
        if: needs.version.outputs.installers == 'true'
        with:
          name: windows-installers
          path: |
            dist\windows\Syft-Notes-Setup.exe
            dist\windows\velopack
          retention-days: 30
      # What the self-test said and drew, every time; the whole folder (its home, recordings and a copy of the model:
      # 80 to 150 MB) only when something failed.
      - name: The self-test's words, logs and pictures
        uses: actions/upload-artifact@v7
        continue-on-error: true
        if: always()
        with:
          name: windows-selftest
          path: |
            ${{ runner.temp }}\selftest\**\*.txt
            ${{ runner.temp }}\selftest\**\*.log
            ${{ runner.temp }}\selftest\*.png
            ${{ runner.temp }}\selftest\*\*.png
          retention-days: 7
      - name: The self-test's whole folder, as something failed
        uses: actions/upload-artifact@v7
        continue-on-error: true
        if: failure()
        with:
          name: windows-selftest-full
          path: |
            ${{ runner.temp }}\selftest
            ${{ runner.temp }}\selftest-home*\**\*.log
          retention-days: 7
      # How this run signed the installer, as the name of an artifact: a rehearsal's is never published or reused.
      - name: How Setup.exe was signed
        if: needs.version.outputs.installers == 'true'
        shell: pwsh
        run: |
          "${{ needs.version.outputs.win_signing }}" | Set-Content "$env:RUNNER_TEMP\windows-signing.txt"
      - uses: actions/upload-artifact@v7
        continue-on-error: true
        if: needs.version.outputs.installers == 'true'
        with:
          name: signing-windows-${{ needs.version.outputs.win_signing }}
          path: ${{ runner.temp }}\windows-signing.txt
          retention-days: 30
      - name: Signing - the rehearsal's certificate is removed
        if: always() && needs.version.outputs.win_signing == 'rehearsal'
        shell: pwsh
        run: .\windows\signing-setup.ps1 -Cleanup

  # Linux: one self-contained folder per processor, each packed as its one download, Syft-Notes-linux-<x64|arm64>.tar.gz
  # (linux/build.sh), with the install.sh that puts it in ~/.local/share/syft-notes. Each is built and proved on its own
  # processor (ubuntu-24.04 and ubuntu-24.04-arm), under Xvfb. What ships is a student's copy, with no self-test, demo
  # libraries or test switches in it (linux/build.sh stops if they are, and the installed copy is checked); the
  # self-tests run a copy of the same code built with them (--test-helpers), which is never shipped: as just this
  # computer and as a laptop, the second from where install.sh puts it. The student's tarball is installed first, run
  # from there, and uninstalled. A merge throws the tarballs away; a release keeps the student's for publishing.
  linux-app:
    name: Linux app (${{ matrix.rid }}, self-test, tarball)
    needs: [version]
    # As the Mac and Windows apps: a release that reuses a rehearsal's installers doesn't build them again.
    if: github.event_name != 'pull_request' && (needs.version.outputs.tested != 'true' || (needs.version.outputs.installers == 'true' && needs.version.outputs.reuse_run == ''))
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
            elf: x86-64
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            elf: aarch64
    timeout-minutes: 30
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/dotnet
        with:
          packages: linux-app
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The phone app (web/), which the library serves at /app/, in a step of its own: npm's packages run their install
      # scripts here, where no secret is in reach. The builds after it use web/dist as it is (STUDYSTASH_SKIP_WEB).
      - name: The phone app (web/), built with no secret in reach
        shell: bash
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - uses: ./.github/actions/whisper-tiny
      - name: What the app needs from a desktop, on a runner that has none - a virtual display, and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb xauth libx11-6 libice6 libsm6 libfontconfig1 fonts-dejavu-core fonts-noto-core libpulse0
      # No secret: this copy is never shipped.
      - name: Build the copy the self-tests run (${{ matrix.rid }}, with the test helpers; never shipped)
        env:
          STUDYSTASH_LINUX_RIDS: ${{ matrix.rid }}
          STUDYSTASH_SKIP_WEB: "1"
        run: sh linux/build.sh --test-helpers dist/linux-test
      - name: Build ${{ matrix.rid }} and Syft-Notes-${{ matrix.rid }}.tar.gz - the student's copy, with no test helpers
        env:
          STUDYSTASH_LINUX_RIDS: ${{ matrix.rid }}
          # The laptop's Google sign-in secret, built into the app as on the Mac.
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
          STUDYSTASH_SKIP_WEB: "1"
        run: sh linux/build.sh dist/linux
      - name: The tarball holds one folder that runs, its native code built for this processor, the live words' small Whisper, and no transcription model or debug symbols
        env:
          RID: ${{ matrix.rid }}
          ELF: ${{ matrix.elf }}
        run: |
          app=dist/linux/$RID/syft-notes
          V=$(sed -n 's:.*<StudyStashVersion>\(.*\)</StudyStashVersion>.*:\1:p' engine/Directory.Build.props)
          printed=$(env -u DOTNET_ROOT "$app/StudyStash" version)
          [ "$printed" = "$V" ] || { echo "version printed '$printed', expected '$V'"; exit 1; }
          echo "V=$V" >> "$GITHUB_ENV"
          [ "$(tar -tzf "dist/linux/Syft-Notes-$RID.tar.gz" | cut -d/ -f1 | sort -u)" = syft-notes ] || { echo "the tarball isn't one syft-notes/ folder"; exit 1; }
          grep -q "^version = $V\$" "$app/study-stash.ini" || { echo "study-stash.ini doesn't say $V"; exit 1; }
          for f in install.sh uninstall.sh syft-notes.desktop syft-notes.png models/live-whisper-tiny-q8_0.bin libSkiaSharp.so libHarfBuzzSharp.so \
                   libsherpa-onnx-c-api.so "runtimes/$RID/libwhisper.so" CSharpMath.SkiaSharp.dll Svg.Skia.dll Microsoft.Msagl.dll Markdig.dll; do
            [ -e "$app/$f" ] || { echo "$RID has no $f"; exit 1; }
          done
          for f in libSkiaSharp.so libHarfBuzzSharp.so "runtimes/$RID/libwhisper.so" StudyStash; do
            file -L "$app/$f" | grep -q "$ELF" || { echo "$f isn't built for $ELF: $(file -L "$app/$f")"; exit 1; }
          done
          [ -z "$(find "$app" -name '*.pdb')" ] || { echo "$RID carries debug symbols"; exit 1; }
          [ -z "$(find "$app" -name '*.bin' -size +1M ! -name 'live-whisper-*.bin')" ] || { echo "a model file is bundled"; exit 1; }
          [ ! -e "$app/needle" ] && [ ! -e "$app/models/whistle.cact" ] || { echo "$RID carries Cactus Whistle, which has no Linux engine"; exit 1; }
      # It ends with "Answer your phone when Syft Notes is closed" on (a real systemd --user unit on this throwaway
      # runner, or an autostart entry where the account has no systemd of its own), checked once the app has quit.
      - name: Self-test, just this computer - setup makes the app's own library, the notes are written here, quitting stops it, and the phone is answered with the app closed
        if: needs.version.outputs.tested != 'true'
        timeout-minutes: 14
        env:
          STUDYSTASH_SELFTEST_FLOW: one-computer
          STUDYSTASH_SELFTEST_BACKGROUND: "1"
          RID: ${{ matrix.rid }}
        run: |
          # A systemd of the runner's own account, as a desktop login has (started and waited for by systemctl itself).
          if sudo loginctl enable-linger "$(id -un)" && sudo systemctl start "user@$(id -u).service"; then
            export XDG_RUNTIME_DIR="/run/user/$(id -u)" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$(id -u)/bus"
          fi
          out="$RUNNER_TEMP/selftest/one-computer"
          sh linux/selftest.sh "dist/linux-test/$RID/syft-notes" "$out"
          grep -q "just this computer" "$out/selftest.txt" || { echo "the self-test didn't run Just this computer"; exit 1; }
          grep -q "notes written on this computer by its own library" "$out/selftest.txt" || { echo "the notes weren't written by this computer's own library"; exit 1; }
          grep -q "^background library registered" "$out/selftest.txt" || { echo "the self-test didn't turn on answering with the app closed"; exit 1; }
          grep -q "^the phone got its answer with the app closed" "$out/background.txt" || { echo "the phone wasn't answered with the app closed"; exit 1; }
          ! ls "${XDG_CONFIG_HOME:-$HOME/.config}"/systemd/user/syft-notes-background*.service "${XDG_CONFIG_HOME:-$HOME/.config}"/autostart/syft-notes-background*.desktop 2>/dev/null || { echo "a registration was left behind"; exit 1; }
          # The library ran as the app's own child (StudyStash serve): quitting the app stops it too, and the background one
          # is gone once the self-test took it away.
          # pidwait blocks until every process whose command line matches has gone (no polling), timeout bounds it; the
          # [S] keeps the pattern from matching timeout's and pidwait's own command lines.
          app_processes="dist/linux-test/$RID/syft-notes/[S]tudyStash"
          command -v pidwait > /dev/null || { echo "::error::this runner has no pidwait (procps)"; exit 1; }
          timeout 20 pidwait -f "$app_processes" || true
          if pgrep -fa "$app_processes"; then echo "the app's library was still running 20 s after the app quit"; exit 1; fi
      - name: install.sh puts Syft Notes on an account of its own (the app, its menu entry, its icon, syft-notes on the PATH, no self-test in it), the copy with the test helpers installed over it self-tests as a laptop, and uninstall.sh takes it off again
        timeout-minutes: 12
        env:
          RID: ${{ matrix.rid }}
        run: |
          export HOME="$RUNNER_TEMP/student"
          mkdir -p "$HOME"
          tar -xzf "dist/linux/Syft-Notes-$RID.tar.gz" -C "$RUNNER_TEMP"
          STUDYSTASH_NO_OPEN=1 sh "$RUNNER_TEMP/syft-notes/install.sh"
          app="$HOME/.local/share/syft-notes"
          [ "$("$HOME/.local/bin/syft-notes" version)" = "$V" ] || { echo "syft-notes on the PATH isn't $V"; exit 1; }
          grep -q "^Exec=\"$app/StudyStash\" %u$" "$HOME/.local/share/applications/syft-notes.desktop" || { echo "the menu entry doesn't start the installed app"; cat "$HOME/.local/share/applications/syft-notes.desktop"; exit 1; }
          [ -s "$HOME/.local/share/icons/hicolor/256x256/apps/syft-notes.png" ] || { echo "no icon"; exit 1; }
          [ "$(perl -0777 -ne 'print /s\0e\0l\0f\0t\0e\0s\0t\0\.\0t\0x\0t/ ? "self-test" : "clean"' "$app/StudyStash.dll")" = clean ] || { echo "the installed copy has the self-test in it"; exit 1; }
          # Installing again over it (as a second download does) replaces it in place: with the copy that has the test
          # helpers, which is the one self-tested from where it is installed.
          mkdir "$RUNNER_TEMP/test"
          tar -xzf "dist/linux-test/Syft-Notes-$RID.tar.gz" -C "$RUNNER_TEMP/test"
          STUDYSTASH_NO_OPEN=1 sh "$RUNNER_TEMP/test/syft-notes/install.sh"
          [ ! -e "$app.old" ] || { echo "an old copy was left beside the new one"; exit 1; }
          out="$RUNNER_TEMP/selftest/laptop"
          sh linux/selftest.sh "$app" "$out"
          grep -q "^rich notes: .* typeset; a flowchart laid out" "$out/selftest.txt" || { echo "the self-test didn't see the notes' formulas and flowchart drawn"; exit 1; }
          grep -q "^opened larger: " "$out/selftest.txt" || { echo "the self-test didn't open the flowchart larger"; exit 1; }
          sh "$app/uninstall.sh"
          for f in "$app" "$HOME/.local/bin/syft-notes" "$HOME/.local/share/applications/syft-notes.desktop"; do
            [ ! -e "$f" ] || { echo "$f survived uninstalling"; exit 1; }
          done
      # Velopack's package (docs/LIBRARIES.md, phase 5): the AppImage, which a tarball copy moves over to, and the update
      # feed.
      - name: vpk, Velopack's packager, and mksquashfs for the AppImage
        if: needs.version.outputs.installers == 'true'
        run: |
          dotnet tool install -g vpk --version 1.2.161
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          command -v mksquashfs > /dev/null || sudo apt-get install -y -qq squashfs-tools > /dev/null
      - name: Velopack's AppImage and update packages for ${{ matrix.rid }}
        if: needs.version.outputs.installers == 'true'
        env:
          STUDYSTASH_LINUX_RIDS: ${{ matrix.rid }}
        run: sh linux/velopack-pack.sh dist/linux
      - uses: actions/upload-artifact@v7
        if: needs.version.outputs.installers == 'true'
        with:
          name: linux-installers-${{ matrix.rid }}
          path: |
            dist/linux/Syft-Notes-${{ matrix.rid }}.tar.gz
            dist/linux/velopack/${{ matrix.rid }}
          retention-days: 30
      # What the self-test said and drew, every time; the whole folder (its home, recordings and a copy of the model:
      # 80 to 150 MB) only when something failed.
      - name: The self-test's words, logs and pictures
        uses: actions/upload-artifact@v7
        continue-on-error: true
        if: always()
        with:
          name: linux-selftest-${{ matrix.rid }}
          path: |
            ${{ runner.temp }}/selftest/**/*.txt
            ${{ runner.temp }}/selftest/**/*.log
            ${{ runner.temp }}/selftest/*.png
            ${{ runner.temp }}/selftest/*/*.png
          retention-days: 7
      - name: The self-test's whole folder, as something failed
        uses: actions/upload-artifact@v7
        continue-on-error: true
        if: failure()
        with:
          name: linux-selftest-${{ matrix.rid }}-full
          path: |
            ${{ runner.temp }}/selftest
          retention-days: 7

  # Publish v<version> the first time it passes everything above, with the one download per system, the four old role
  # names as byte-for-byte copies of them (0.8.x and older copies update themselves by those names, and old libraries'
  # "Connect your laptop" links point at them), and their checksums. A version already tagged is never published
  # again. The installers are the ones this run built and proved, or the ones a run by hand built and proved on
  # exactly this code. A run by hand goes through all of it but the last step, and publishes nothing.
  # Every job it needs must have passed or been skipped: a job that runs out of time ends "cancelled", not "failed", so
  # !failure() alone let a release through after Windows' Core tests timed out (run 41495152314).
  release:
    name: publish release
    needs: [version, connections, engine, mac-app, mac-intel, windows-app, linux-app]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.version.outputs.installers == 'true' && (needs.version.outputs.reuse_run != '' || (needs.mac-app.result == 'success' && needs.mac-intel.result == 'success' && needs.windows-app.result == 'success' && needs.linux-app.result == 'success')) }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read  # to download the installers a run by hand built
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The installers about to be published are signed as this run was told to sign them (a run by hand's, reused, may not
      # have been), and are never a rehearsal's.
      - name: The installers are signed as planned
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ needs.version.outputs.reuse_run || github.run_id }}
          PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          REUSE: ${{ needs.version.outputs.reuse_run != '' }}
          EXPECT_MAC: ${{ needs.version.outputs.mac_signing }}
          EXPECT_WIN: ${{ needs.version.outputs.win_signing }}
        run: bash .github/scripts/signing-plan.sh release
      - uses: actions/download-artifact@v8
        with:
          name: mac-installers
          path: dist
          run-id: ${{ needs.version.outputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: windows-installers
          path: dist
          run-id: ${{ needs.version.outputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: linux-installers-*
          merge-multiple: true
          path: dist
          run-id: ${{ needs.version.outputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: ${{ github.event_name == 'push' && 'Publish' || 'Rehearse publishing (a run by hand publishes nothing)' }} v${{ needs.version.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
          PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          test -s dist/Syft-Notes.dmg && test -s dist/Syft-Notes-Setup.exe && test -s dist/Syft-Notes-linux-x64.tar.gz && test -s dist/Syft-Notes-linux-arm64.tar.gz \
            || { echo "an installer is missing or empty"; ls -l dist; exit 1; }
          # Velopack's files for each channel (docs/LIBRARIES.md, phase 5): the update feeds the app reads, the full and
          # delta packages, Velopack's Setup.exe per Windows processor and the AppImage per Linux one (what an Inno-era
          # or tarball copy moves over with). The Mac's DMG already holds Velopack's bundle. Each name is vpk's own and
          # unique to its channel.
          mkdir -p dist/velopack-all
          for c in osx win-x64 win-arm64 linux-x64 linux-arm64; do
            test -s "dist/velopack/$c/releases.$c.json" || { echo "no Velopack feed for $c"; ls -lR dist/velopack; exit 1; }
            cp dist/velopack/$c/* dist/velopack-all/
          done
          test -s dist/velopack-all/SyftNotes-win-x64-Setup.exe && test -s dist/velopack-all/SyftNotes-win-arm64-Setup.exe \
            && test -s dist/velopack-all/SyftNotes-linux-x64.AppImage && test -s dist/velopack-all/SyftNotes-linux-arm64.AppImage \
            || { echo "a Velopack installer is missing"; ls -l dist/velopack-all; exit 1; }
          # Re-check the race: another push could have published this tag while this run was building.
          released=false
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null || gh release view "v$V" >/dev/null 2>&1; then released=true; fi
          if [ "$released" = true ] && [ "$PUBLISH" = true ]; then
            echo "v$V is already released; bump StudyStashVersion in engine/Directory.Build.props to publish a new one."
            exit 0
          fi
          for role in Laptop Library; do
            cp dist/Syft-Notes.dmg "dist/Study-Stash-$role.dmg"
            cp dist/Syft-Notes-Setup.exe "dist/Study-Stash-$role-Setup.exe"
          done
          # The names from before the rename to Syft Notes: 0.19.0 asks for Egghead-Notes.*, 0.18.x and older for
          # Study-Stash.*, when they update themselves (and older download links use them): byte for byte the one
          # download, so every copy finds its way to this release.
          cp dist/Syft-Notes.dmg dist/Egghead-Notes.dmg
          cp dist/Syft-Notes-Setup.exe dist/Egghead-Notes-Setup.exe
          cp dist/Syft-Notes.dmg dist/Study-Stash.dmg
          cp dist/Syft-Notes-Setup.exe dist/Study-Stash-Setup.exe
          (cd dist/velopack-all && sha256sum SyftNotes-*-Setup.exe SyftNotes-*.AppImage > ../velopack-sums.txt)
          (cd dist && sha256sum Syft-Notes* Egghead-Notes* Study-Stash* > SHA256SUMS.txt && cat velopack-sums.txt >> SHA256SUMS.txt)
          ls -l dist
          cat dist/SHA256SUMS.txt
          if [ "$PUBLISH" != true ]; then
            echo "A rehearsal: v$V would be published now with the files above. Nothing was."
            if [ "$released" = true ]; then echo "(v$V is already released, so a push would stop before this.)"; fi
            exit 0
          fi
          gh release create "v$V" --target "$GITHUB_SHA" --title "Syft Notes $V" --generate-notes \
            dist/Syft-Notes.dmg dist/Syft-Notes-Setup.exe \
            dist/Syft-Notes-linux-x64.tar.gz dist/Syft-Notes-linux-arm64.tar.gz \
            dist/Egghead-Notes.dmg dist/Egghead-Notes-Setup.exe \
            dist/Study-Stash.dmg dist/Study-Stash-Setup.exe \
            dist/Study-Stash-Laptop.dmg dist/Study-Stash-Library.dmg \
            dist/Study-Stash-Laptop-Setup.exe dist/Study-Stash-Library-Setup.exe \
            dist/velopack-all/* \
            dist/SHA256SUMS.txt
