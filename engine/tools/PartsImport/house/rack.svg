    <use href="#ear" x="1" y="1.8"/><use href="#ear" x="465.6" y="1.8"/>
    <rect x="24" y="8" width="90" height="28" rx="2" fill="#3B4045"/>
    <rect x="30" y="13" width="40" height="7" rx="1" fill="#4A9AD1"/>
    <circle cx="82" cy="16" r="2" fill="#4FAE73"/><circle cx="92" cy="16" r="2" fill="#4FAE73"/><circle cx="102" cy="16" r="2" fill="#FFC85E"/>
    <use href="#rj45" x="200" y="17"/><use href="#rj45" x="214" y="17"/><use href="#rj45" x="228" y="17"/><use href="#rj45" x="242" y="17"/>
    <use href="#rj45" x="266" y="17"/><use href="#rj45" x="280" y="17"/><use href="#rj45" x="294" y="17"/><use href="#rj45" x="308" y="17"/>
    <use href="#sfp" x="336" y="16"/><use href="#sfp" x="354" y="16"/>
