    <use href="#bay35" x="22" y="4"/><use href="#bay35" x="126" y="4"/><use href="#bay35" x="230" y="4"/><use href="#bay35" x="334" y="4"/>
    <use href="#bay35" x="22" y="31"/><use href="#bay35" x="126" y="31"/><use href="#bay35" x="230" y="31"/><use href="#bay35" x="334" y="31"/>
    <use href="#bay35" x="22" y="58"/><use href="#bay35" x="126" y="58"/><use href="#bay35" x="230" y="58"/><use href="#bay35" x="334" y="58"/>
