  <!-- Blanking panel, 1U -->
  <g id="blanking-panel" transform="translate(700 850)">
    <rect x="0" y="0" width="482.6" height="43.6" rx="2" fill="url(#g-black)" stroke="#24272B" stroke-width="1"/>
