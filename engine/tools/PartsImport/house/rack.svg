    <circle cx="30" cy="12" r="1.6" fill="#4FAE73"/><circle cx="30" cy="19" r="1.6" fill="#4FAE73"/><circle cx="30" cy="26" r="1.6" fill="#FFC85E"/>
    <use href="#rj45" x="44" y="9"/><use href="#rj45" x="44" y="24"/>
    <g>
