    <circle cx="116" cy="16" r="2" fill="#4FAE73"/><circle cx="126" cy="16" r="2" fill="#EE6F5C"/>
    <use href="#rj45" x="190" y="17"/><use href="#rj45" x="204" y="17"/><use href="#rj45" x="218" y="17"/><use href="#rj45" x="232" y="17"/>
    <use href="#rj45" x="256" y="17"/><use href="#rj45" x="270" y="17"/><use href="#rj45" x="284" y="17"/><use href="#rj45" x="298" y="17"/>
