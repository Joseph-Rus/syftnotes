      <use href="#rj45" x="86" y="25"/><use href="#rj45" x="98" y="25"/><use href="#rj45" x="110" y="25"/><use href="#rj45" x="122" y="25"/><use href="#rj45" x="134" y="25"/><use href="#rj45" x="146" y="25"/>
      <use href="#rj45" x="164" y="8"/><use href="#rj45" x="176" y="8"/><use href="#rj45" x="188" y="8"/><use href="#rj45" x="200" y="8"/><use href="#rj45" x="212" y="8"/><use href="#rj45" x="224" y="8"/>
      <use href="#rj45" x="164" y="25"/><use href="#rj45" x="176" y="25"/><use href="#rj45" x="188" y="25"/><use href="#rj45" x="200" y="25"/><use href="#rj45" x="212" y="25"/><use href="#rj45" x="224" y="25"/>
      <use href="#rj45" x="242" y="8"/><use href="#rj45" x="254" y="8"/><use href="#rj45" x="266" y="8"/><use href="#rj45" x="278" y="8"/><use href="#rj45" x="290" y="8"/><use href="#rj45" x="302" y="8"/>
      <use href="#rj45" x="242" y="25"/><use href="#rj45" x="254" y="25"/><use href="#rj45" x="266" y="25"/><use href="#rj45" x="278" y="25"/><use href="#rj45" x="290" y="25"/><use href="#rj45" x="302" y="25"/>
      <use href="#rj45" x="320" y="8"/><use href="#rj45" x="332" y="8"/><use href="#rj45" x="344" y="8"/><use href="#rj45" x="356" y="8"/><use href="#rj45" x="368" y="8"/><use href="#rj45" x="380" y="8"/>
      <use href="#rj45" x="320" y="25"/><use href="#rj45" x="332" y="25"/><use href="#rj45" x="344" y="25"/><use href="#rj45" x="356" y="25"/><use href="#rj45" x="368" y="25"/><use href="#rj45" x="380" y="25"/>
    </g>
    <use href="#sfp" x="400" y="8"/><use href="#sfp" x="416" y="8"/><use href="#sfp" x="400" y="25"/><use href="#sfp" x="416" y="25"/>
