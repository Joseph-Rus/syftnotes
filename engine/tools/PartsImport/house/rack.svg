    <g>
      <use href="#rj45" x="28" y="18"/><use href="#rj45" x="45" y="18"/><use href="#rj45" x="62" y="18"/><use href="#rj45" x="79" y="18"/><use href="#rj45" x="96" y="18"/><use href="#rj45" x="113" y="18"/>
      <use href="#rj45" x="138" y="18"/><use href="#rj45" x="155" y="18"/><use href="#rj45" x="172" y="18"/><use href="#rj45" x="189" y="18"/><use href="#rj45" x="206" y="18"/><use href="#rj45" x="223" y="18"/>
