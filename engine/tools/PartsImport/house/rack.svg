<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 2100">
  <!-- Study Stash's own rack parts, front view, drawn to scale in millimetres: a 19-inch (482.6 mm) rack and the
       equipment that mounts in it (1U = 44.45 mm). Each part is a group with its id; the importer cuts them out. -->
  <defs>
    <linearGradient id="g-panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3F5F7"/><stop offset=".55" stop-color="#D7DCE1"/><stop offset="1" stop-color="#AEB6BE"/></linearGradient>
    <linearGradient id="g-dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7D8389"/><stop offset=".5" stop-color="#555B61"/><stop offset="1" stop-color="#3B4045"/></linearGradient>
    <linearGradient id="g-black" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#555B61"/><stop offset="1" stop-color="#24272B"/></linearGradient>
    <linearGradient id="g-post" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3B4045"/><stop offset=".5" stop-color="#555B61"/><stop offset="1" stop-color="#3B4045"/></linearGradient>
    <linearGradient id="g-screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A9D3F0"/><stop offset="1" stop-color="#4A9AD1"/></linearGradient>
    <g id="rj45"><rect width="11" height="9" rx="1" fill="#24272B" stroke="#6B747D" stroke-width=".6"/><rect x="2.5" y="1.5" width="6" height="4.5" fill="#3B4045"/><rect x="4" y="6" width="3" height="1.6" fill="#555B61"/></g>
    <g id="sfp"><rect width="14" height="10" rx="1" fill="#AEB6BE" stroke="#6B747D" stroke-width=".6"/><rect x="2" y="2" width="10" height="6" fill="#24272B"/></g>
    <g id="bay25"><rect width="68" height="15" rx="1.5" fill="url(#g-black)" stroke="#24272B" stroke-width=".6"/><rect x="3" y="4" width="44" height="7" rx="1" fill="#3B4045"/><line x1="5" y1="6" x2="45" y2="6" stroke="#555B61" stroke-width=".8" stroke-dasharray="2 1.5"/><line x1="5" y1="9" x2="45" y2="9" stroke="#555B61" stroke-width=".8" stroke-dasharray="2 1.5"/><circle cx="56" cy="7.5" r="1.6" fill="#4FAE73"/><circle cx="62" cy="7.5" r="1.6" fill="#4A9AD1"/></g>
    <g id="bay35"><rect width="100" height="26" rx="2" fill="url(#g-black)" stroke="#24272B" stroke-width=".6"/><rect x="4" y="5" width="70" height="16" rx="1.5" fill="#3B4045"/><line x1="7" y1="9" x2="71" y2="9" stroke="#555B61" stroke-width=".9" stroke-dasharray="2.5 2"/><line x1="7" y1="13" x2="71" y2="13" stroke="#555B61" stroke-width=".9" stroke-dasharray="2.5 2"/><line x1="7" y1="17" x2="71" y2="17" stroke="#555B61" stroke-width=".9" stroke-dasharray="2.5 2"/><rect x="80" y="6" width="14" height="14" rx="2" fill="#AEB6BE" stroke="#6B747D" stroke-width=".5"/><circle cx="87" cy="13" r="2" fill="#4FAE73"/></g>
    <g id="outlet"><rect width="18" height="14" rx="3" fill="#24272B" stroke="#555B61" stroke-width=".6"/><rect x="4" y="4" width="2.5" height="6" fill="#7D8389"/><rect x="11.5" y="4" width="2.5" height="6" fill="#7D8389"/></g>
    <g id="ear"><rect width="16" height="40" rx="2" fill="url(#g-dark)" stroke="#24272B" stroke-width=".6"/><circle cx="8" cy="10" r="2.6" fill="#24272B"/><circle cx="8" cy="30" r="2.6" fill="#24272B"/></g>
  </defs>

  <!-- The rack: frame, posts and rails with their holes, U numbers every five units. -->
  <g id="rack-frame">
    <rect x="0" y="0" width="600" height="2000" rx="8" fill="url(#g-black)" stroke="#24272B" stroke-width="2"/>
    <rect x="12" y="50" width="576" height="1880" fill="#3B4045" stroke="#24272B" stroke-width="1.2"/>
    <rect x="12" y="12" width="576" height="38" rx="3" fill="url(#g-dark)" stroke="#24272B" stroke-width="1"/>
    <line x1="60" y1="31" x2="540" y2="31" stroke="#24272B" stroke-width="5" stroke-dasharray="20 8"/>
    <rect x="12" y="1928" width="576" height="52" rx="3" fill="url(#g-dark)" stroke="#24272B" stroke-width="1"/>
    <rect x="30" y="1980" width="60" height="16" rx="3" fill="#24272B"/>
    <rect x="510" y="1980" width="60" height="16" rx="3" fill="#24272B"/>
    <rect x="22" y="58" width="36" height="1868" fill="url(#g-post)" stroke="#24272B" stroke-width="1"/>
    <rect x="542" y="58" width="36" height="1868" fill="url(#g-post)" stroke="#24272B" stroke-width="1"/>
    <line x1="50" y1="60" x2="50" y2="1926.9" stroke="#24272B" stroke-width="7" stroke-dasharray="7 7.82"/>
    <line x1="550" y1="60" x2="550" y2="1926.9" stroke="#24272B" stroke-width="7" stroke-dasharray="7 7.82"/>
    <g font-size="11" fill="#AEB6BE" text-anchor="middle">
      <text x="34" y="1904">1</text><text x="34" y="1726">5</text><text x="34" y="1504">10</text><text x="34" y="1282">15</text><text x="34" y="1059">20</text>
      <text x="34" y="837">25</text><text x="34" y="615">30</text><text x="34" y="393">35</text><text x="34" y="171">40</text><text x="34" y="82">42</text>
    </g>
  </g>

  <!-- 1U server -->
  <g id="server-1u" transform="translate(700 60)">
    <rect x="0" y="0" width="482.6" height="43.6" rx="2" fill="url(#g-panel)" stroke="#6B747D" stroke-width="1"/>
    <use href="#ear" x="1" y="1.8"/><use href="#ear" x="465.6" y="1.8"/>
    <use href="#bay25" x="22" y="5"/><use href="#bay25" x="92" y="5"/><use href="#bay25" x="22" y="23"/><use href="#bay25" x="92" y="23"/>
    <rect x="168" y="6" width="200" height="31" rx="2" fill="#AEB6BE" stroke="#6B747D" stroke-width=".6"/>
    <line x1="172" y1="12" x2="364" y2="12" stroke="#6B747D" stroke-width="2.4" stroke-dasharray="3 2.4"/>
    <line x1="172" y1="18.5" x2="364" y2="18.5" stroke="#6B747D" stroke-width="2.4" stroke-dasharray="3 2.4"/>
    <line x1="172" y1="25" x2="364" y2="25" stroke="#6B747D" stroke-width="2.4" stroke-dasharray="3 2.4"/>
    <line x1="172" y1="31.5" x2="364" y2="31.5" stroke="#6B747D" stroke-width="2.4" stroke-dasharray="3 2.4"/>
    <rect x="378" y="10" width="18" height="10" rx="1" fill="#24272B"/>
    <circle cx="420" cy="22" r="6" fill="#D7DCE1" stroke="#6B747D" stroke-width="1"/><circle cx="420" cy="22" r="2.4" fill="#4FAE73"/>
    <circle cx="438" cy="14" r="2" fill="#4FAE73"/><circle cx="438" cy="22" r="2" fill="#4A9AD1"/><circle cx="438" cy="30" r="2" fill="#FFC85E"/>
    <rect x="448" y="8" width="12" height="27" rx="1.5" fill="#F3F5F7" stroke="#AEB6BE" stroke-width=".6"/>
  </g>

  <!-- 2U server -->
  <g id="server-2u" transform="translate(700 140)">
    <rect x="0" y="0" width="482.6" height="88.1" rx="2.5" fill="url(#g-panel)" stroke="#6B747D" stroke-width="1"/>
    <use href="#ear" x="1" y="4"/><use href="#ear" x="465.6" y="44"/><use href="#ear" x="465.6" y="4"/><use href="#ear" x="1" y="44"/>
    <use href="#bay35" x="22" y="8"/><use href="#bay35" x="126" y="8"/><use href="#bay35" x="230" y="8"/>
    <use href="#bay35" x="22" y="40"/><use href="#bay35" x="126" y="40"/><use href="#bay35" x="230" y="40"/>
    <rect x="338" y="8" width="104" height="58" rx="2" fill="#AEB6BE" stroke="#6B747D" stroke-width=".6"/>
    <line x1="342" y1="15" x2="438" y2="15" stroke="#6B747D" stroke-width="2.6" stroke-dasharray="3 2.4"/>
    <line x1="342" y1="23" x2="438" y2="23" stroke="#6B747D" stroke-width="2.6" stroke-dasharray="3 2.4"/>
    <line x1="342" y1="31" x2="438" y2="31" stroke="#6B747D" stroke-width="2.6" stroke-dasharray="3 2.4"/>
    <line x1="342" y1="39" x2="438" y2="39" stroke="#6B747D" stroke-width="2.6" stroke-dasharray="3 2.4"/>
    <line x1="342" y1="47" x2="438" y2="47" stroke="#6B747D" stroke-width="2.6" stroke-dasharray="3 2.4"/>
    <line x1="342" y1="55" x2="438" y2="55" stroke="#6B747D" stroke-width="2.6" stroke-dasharray="3 2.4"/>
    <circle cx="358" cy="77" r="6" fill="#D7DCE1" stroke="#6B747D" stroke-width="1"/><circle cx="358" cy="77" r="2.4" fill="#4FAE73"/>
    <circle cx="378" cy="77" r="2" fill="#4FAE73"/><circle cx="388" cy="77" r="2" fill="#4A9AD1"/><circle cx="398" cy="77" r="2" fill="#4FAE73"/>
    <rect x="410" y="72" width="16" height="10" rx="1" fill="#24272B"/>
    <rect x="448" y="10" width="12" height="68" rx="2" fill="#F3F5F7" stroke="#AEB6BE" stroke-width=".6"/>
  </g>

